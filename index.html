<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';
  script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;
  font-src 'self'; manifest-src 'self'; worker-src 'self'; child-src 'self' blob:;
  connect-src 'self' https://api.github.com https://gist.githubusercontent.com;
  base-uri 'none'; form-action 'none'">
<title>Разбор колоды</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101312">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Разбор колоды">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  /* Светлая: тёплая бумага без синевы. Текст почти чёрный — контраст около 17:1,
     это вдвое выше нормы AAA, и на солнце экран остаётся читаемым. */
  --paper:#F4F2EC; --panel:#FFFFFF; --ink:#101315; --ink2:#3F4447; --ink3:#64696C;
  --rule:#D2CFC6; --hard:#96200F; --mid:#8A5606; --soft:#6B5C39; --easy:#25573C; --accent:#4A2C93;
  /* --ink3 подобран так, чтобы мелкие подписи держали норму AA на этой бумаге */
  /* единый шаг отступов: всё в вёрстке кратно ему, поэтому ничто не липнет к краю */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --tap:44px;                       /* наименьшая цель для пальца */
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --jp:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101312; --panel:#1B201E; --ink:#F2F1EB; --ink2:#C3C8C4; --ink3:#949B97;
    --rule:#333937; --hard:#F08375; --mid:#EDB863; --soft:#D2BC85; --easy:#84CFA0; --accent:#B49CF5;
  }
}
:root[data-theme="dark"]{
  --paper:#101312; --panel:#1B201E; --ink:#F2F1EB; --ink2:#C3C8C4; --ink3:#949B97;
  --rule:#333937; --hard:#F08375; --mid:#EDB863; --soft:#D2BC85; --easy:#84CFA0; --accent:#B49CF5;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink3);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
[hidden]{display:none !important}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);min-height:100%;overflow-wrap:break-word}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;
     padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
img,svg,video,table{max-width:100%}
body{font-family:var(--ui);line-height:1.45;-webkit-text-size-adjust:100%}
#root{max-width:940px;margin:0 auto;padding:var(--s5) var(--s5) calc(80px + env(safe-area-inset-bottom))}
h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em}
p{margin:0}
.note{font-size:12px;color:var(--ink3);font-family:var(--ui);line-height:1.55}
.fold .body .note,.fold .body .acts,.fold .body label,.fold .body input,
.fold .body summary,.fold .body button{font-family:var(--ui)}

.top{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);
     padding-bottom:var(--s3);border-bottom:2px solid var(--ink)}
.brand{display:flex;gap:11px;align-items:center;min-width:0}
.mark{font-family:var(--jp);font-size:22px;line-height:1;width:38px;height:38px;display:grid;place-items:center;
      border:1.5px solid var(--ink);border-radius:2px;flex:none}
.sub{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:2px;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex:none}
.iconbtn{border:1px solid var(--rule);background:var(--panel);color:var(--ink2);border-radius:3px;
         width:40px;height:40px;font-size:16px;cursor:pointer;line-height:1}
.iconbtn:hover{border-color:var(--ink2)}

.intake{margin-top:20px}
.drop{border:1.5px dashed var(--rule);border-radius:4px;padding:30px 20px;text-align:center;background:var(--panel)}
.drop.over{border-color:var(--ink)}
.dropTitle{font-size:16px;font-weight:600;margin-bottom:10px}
.dropHint{font-size:12.5px;color:var(--ink2);margin-bottom:18px;line-height:1.6}
.progress{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-top:12px;min-height:16px}

.btn{display:inline-block;font:inherit;font-size:13px;padding:10px 14px;border-radius:3px;border:1px solid var(--rule);
     background:var(--panel);color:var(--ink);cursor:pointer;text-align:center}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{font-size:12.5px;padding:10px 12px}
.btn.big{font-size:14.5px;padding:11px 22px;font-weight:600}
.btn.danger:hover{border-color:var(--hard);color:var(--hard)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.row:focus-visible,
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.controls{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.line1{display:flex;gap:8px;min-width:0}
#q{flex:1 1 auto;min-width:0;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink)}
#sort{flex:0 1 auto;min-width:0;max-width:46%;font:inherit;font-size:13px;padding:9px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink)}
.line2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--rule);background:transparent;
      color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-family:var(--mono);font-size:10.5px;opacity:.7;margin-left:5px}
.chip.reset{border-style:dashed;color:var(--ink3)}
/* Главное действие — своей полосой во всю ширину. Остальные кнопки под ним
   и мельче: видно, что здесь главное, а что рядом. */
.cta{display:block;width:100%;margin:var(--s4) 0 var(--s3);padding:var(--s4) var(--s5);
     font-size:16px;font-weight:650;line-height:1.25;border-radius:4px;min-height:60px}
.cta small{display:block;font-size:12.5px;font-weight:400;opacity:.78;margin-top:3px;letter-spacing:.02em}
.line3{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.count{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-left:auto}
.spacer{flex:1}

#list{margin-top:6px;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:3px 22px 1fr auto;gap:var(--s3);align-items:center;width:100%;
     padding:var(--s3) var(--s1);min-height:56px;
     border:0;border-bottom:1px solid var(--rule);background:none;cursor:pointer;text-align:left;font:inherit;color:inherit}
.row:hover{background:var(--panel)}
.row.cursor{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
.bar{align-self:stretch;border-radius:2px;background:var(--c);min-height:32px}
.tier{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--c);text-align:center}
.term{font-family:var(--jp);font-size:17px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}
.read{font-size:12.5px;color:var(--ink3);font-family:var(--jp)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.check{color:var(--easy);font-size:12px}
.nums{font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:right;line-height:1.5;white-space:nowrap}
.nums b{font-size:15px;color:var(--c);display:block;font-weight:600}

.editor{padding:8px 0 16px 14px;border-bottom:1px solid var(--rule);background:var(--panel)}
.fgrid{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.btn.big small{display:block;font-size:11.5px;font-weight:400;opacity:.75;margin-top:2px;letter-spacing:.02em}
#sizeOwn{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--rule);border-radius:3px;
         background:var(--panel);color:var(--ink)}
.planTop{display:flex;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.planNum{flex:1 1 90px;border:1px solid var(--rule);border-radius:4px;padding:9px 10px;background:var(--panel);
         font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.planNum b{display:block;font-family:var(--ui);font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink)}
.lessons{margin-top:14px;display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto;
         overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.lesson{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;
        padding:9px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--panel);cursor:pointer}
.lesson:hover{border-color:var(--ink2)}
.lesson.done{opacity:.62}
.lnum{font-family:var(--mono);font-size:13px;color:var(--ink3);min-width:22px;text-align:right}
.lmain{flex:1;min-width:0}
.ltitle{display:flex;gap:8px;align-items:baseline;font-size:14px}
.lstate{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.lbar{display:block;height:3px;border-radius:2px;background:var(--rule);margin:5px 0 4px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.lesson.done .lbar i{background:var(--easy)}
.lsub{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.lword{font-family:var(--jp);font-size:15px;color:var(--ink3);flex:none;max-width:35%;overflow:hidden;white-space:nowrap}
.grades{display:flex;gap:8px;width:100%}
.grades .btn{flex:1;line-height:1.25}
.grades .btn small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:3px}
/* подсказка про цифру нужна только там, где есть клавиатура */
.kbd{display:none}
@media (hover:hover) and (pointer:fine){
  .grades .btn{position:relative}
  .kbd{display:block;position:absolute;top:5px;left:7px;font-family:var(--mono);font-style:normal;
       font-size:10px;line-height:1;padding:2px 4px;border:1px solid currentColor;border-radius:2px;opacity:.5}
}
.grades .g0{border-color:var(--hard);color:var(--hard)} .grades .g0 small{color:var(--hard);opacity:.8}
.grades .g1{border-color:var(--mid);color:var(--mid)}   .grades .g1 small{color:var(--mid);opacity:.8}
.grades .g2{border-color:var(--easy);color:var(--easy)} .grades .g2 small{color:var(--easy);opacity:.8}
.simpair{border-bottom:1px solid var(--rule);padding-bottom:8px}
.simpair:last-child{border-bottom:0;padding-bottom:0}
.simhead{display:flex;gap:8px;align-items:center}
.simhead button{flex:1;min-width:0}
.simdiff{width:100%;margin-top:6px;font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--rule);
         border-radius:3px;background:var(--paper);color:var(--ink);resize:vertical}
.simdiff.filled{border-color:var(--accent)}
/* ---------- знаки ---------- */
.kjrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.kjlab{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.kj{font-family:var(--jp);font-size:19px;line-height:1;min-width:38px;min-height:38px;padding:4px 8px;
    border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink);cursor:pointer}
.kj:hover{border-color:var(--ink2)}
.kj.filled{border-color:var(--accent);border-bottom-width:3px}
.kjhead{display:flex;gap:14px;align-items:flex-start;margin:8px 0 4px}
.kjbig{font-family:var(--jp);font-size:64px;line-height:1;flex:none}
.kjfacts{flex:1;min-width:0}
.kjmean{font-family:var(--serif);font-size:19px;line-height:1.35;color:var(--ink)}
.kjmean.none{font-family:var(--ui);font-size:13px;color:var(--ink3)}
.kjread{font-family:var(--jp);font-size:14px;color:var(--ink2);margin-top:4px}
.kjfacts .note{margin-top:6px}
.kjwords{margin-top:14px}
.kjwrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;max-height:33vh;overflow-y:auto;
        overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.kjword{font:inherit;font-family:var(--jp);font-size:15px;padding:6px 10px;border:1px solid var(--rule);
        border-radius:3px;background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;
        align-items:baseline;gap:7px;min-height:38px}
.kjword:hover{border-color:var(--ink2)}
.kjword .n{font-family:var(--mono);font-size:11px;color:var(--hard)}
/* знак прямо в строке списка: долгое нажатие открывает разбор.
   Подчёркивание — «разобран», оно же намекает, что по знаку можно нажать. */
/* .term — флекс с отступом между элементами, поэтому слово целиком лежит
   в одном .wordtxt: иначе каждый знак стал бы отдельным элементом и между
   знаками появился бы отступ. Знаки внутри — строчные, впритык. */
.wordtxt{min-width:0}
.kjt{display:inline;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kjt.filled{border-bottom:2px solid var(--accent)}
/* ---------- экран знаков ---------- */
.ksheet{position:fixed;inset:0;background:var(--paper);z-index:60;display:flex;flex-direction:column}
.ksheet .kstat{flex:1;font-family:var(--mono);font-size:11.5px;color:var(--ink3);min-width:0;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbar{padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.kbar input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;
            background:var(--panel);color:var(--ink);width:100%}
.kgrid{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
       padding:12px 14px calc(20px + env(safe-area-inset-bottom));
       display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start}
/* знаков бывает больше тысячи: браузер пропускает отрисовку тех, что вне экрана */
.ktile{content-visibility:auto;contain-intrinsic-size:auto 96px;
       font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:var(--s2) var(--s1);
       border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink);
       cursor:pointer;min-height:92px;text-align:center;overflow:hidden}
.ktile:hover{border-color:var(--ink2)}
.ktile.filled{border-bottom-width:3px;border-bottom-color:var(--accent)}
.ktile .c{font-family:var(--jp);font-size:30px;line-height:1.1}
.ktile .w{font-family:var(--mono);font-size:10.5px;color:var(--hard)}
.ktile .m{font-size:11px;line-height:1.25;color:var(--ink3);max-width:100%;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ktile.filled .m{color:var(--ink2)}
.kempty{grid-column:1/-1;padding:26px 0;text-align:center;color:var(--ink3);font-size:13px}
.tally{margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.tallyLine{font-size:13px;color:var(--ink3);line-height:1.6}
.tallyLine b{color:var(--ink);font-weight:600}
.tbars{display:flex;gap:3px;align-items:flex-end;height:56px;margin:10px 0 4px}
.tbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.tbar i{display:block;width:100%;background:var(--rule);border-radius:2px 2px 0 0;transition:height .3s}
.tbar.now i{background:var(--accent)}
.tbar span{font-family:var(--mono);font-size:9px;color:var(--ink3);margin-top:3px}
.tallyTab{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;margin-top:4px}
.tallyTab th{text-align:left;font-weight:400;color:var(--ink3);letter-spacing:.04em;
             text-transform:uppercase;font-size:10px;padding:4px 6px 6px 0;border-bottom:1px solid var(--rule)}
.tallyTab td{padding:5px 6px 5px 0;border-bottom:1px solid var(--rule);color:var(--ink2)}
.tallyTab tr:last-child td{border-bottom:0}
.bigline{font-family:var(--serif);font-size:19px;line-height:1.4;margin:2px 0 10px;color:var(--ink)}
@keyframes doneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sheet.calm{animation:doneIn .34s ease-out}
.backTag{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
         color:var(--accent);margin:0 0 14px}
.say{font:inherit;font-size:15px;line-height:1;border:1px solid var(--rule);border-radius:3px;
     background:var(--panel);color:var(--ink2);cursor:pointer;flex:none;vertical-align:middle;
     min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.say:hover{border-color:var(--ink2)}
.subhead{margin:16px 0 0;padding-top:11px;border-top:1px solid var(--rule);font-family:var(--mono);
         font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.f label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
         color:var(--ink3);margin-bottom:3px}
.f textarea{width:100%;font-family:var(--jp);font-size:14px;padding:8px 9px;border:1px solid var(--rule);border-radius:3px;
            background:var(--paper);color:var(--ink);resize:vertical;min-height:38px;line-height:1.45}
.f textarea.changed{border-color:var(--easy);border-left-width:3px}
.f.mine label{color:var(--mid)} .f.mine textarea{border-color:var(--mid);border-left-width:3px;font-family:var(--ui)}
.f.long textarea{border-color:var(--accent);border-left-width:3px;font-family:var(--serif);font-size:15px;line-height:1.6;min-height:96px}
.f.long label{color:var(--accent)}
.fold{margin-top:8px;border:1px solid var(--rule);border-radius:3px;background:var(--paper)}
.fold>summary{cursor:pointer;padding:9px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;
              text-transform:uppercase;color:var(--ink3);list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸ ";color:var(--ink3)}
.fold[open]>summary::before{content:"▾ "}
.fold[open]>summary{color:var(--ink2);border-bottom:1px solid var(--rule)}
.fold .body{padding:12px;font-family:var(--jp);font-size:14px;line-height:1.65;color:var(--ink2);overflow-wrap:anywhere;overscroll-behavior:contain;
            max-height:360px;overflow:auto;white-space:pre-wrap}
.fold .body.prose{font-family:var(--serif);font-size:16px;line-height:1.75;color:var(--ink)}
.fold .body.prose p{margin:0 0 11px} .fold .body.prose p:last-child{margin:0}
.fold .body.prose strong{font-weight:700;color:var(--ink)}
.fold .body.prose .jp{font-family:var(--jp);font-size:15.5px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.simlist{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px}
.simlist button{font:inherit;font-family:var(--jp);font-size:13px;padding:3px 9px;border:1px solid var(--rule);border-radius:3px;
                background:var(--panel);color:var(--ink);cursor:pointer}
.simlist .why{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:5px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;min-width:0}
.acts>*{max-width:100%}
.acts .grow{flex:1}

.more{text-align:center;padding:18px}
.empty{padding:44px 10px;text-align:center;color:var(--ink3);font-size:13.5px}
/* Пока колода поднимается из базы, показываем её силуэт. Иначе на секунду
   мелькает приглашение загрузить файл — будто данные пропали. */
.boot{margin-top:6px;border-top:1px solid var(--rule)}
.bootRow{display:grid;grid-template-columns:3px 22px 1fr auto;gap:10px;align-items:center;
         padding:11px 4px 11px 0;border-bottom:1px solid var(--rule)}
.bootRow i{display:block;border-radius:3px;background:var(--rule);opacity:.55;animation:pulse 1.4s ease-in-out infinite}
.bootRow i.b{height:32px;border-radius:2px}
.bootRow i.t{height:13px;width:16px;justify-self:center}
.bootRow i.w{height:17px}
.bootRow i.n{height:26px;width:52px}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.62}}
@media (prefers-reduced-motion:reduce){.bootRow i{animation:none}}

/* z-index выше урока (60): окно знака открывается прямо из урока */
.modal{position:fixed;inset:0;background:rgba(8,10,9,.6);display:grid;place-items:center;padding:18px;z-index:65;overscroll-behavior:contain}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:4px;max-width:680px;width:100%;max-height:84vh;overscroll-behavior:contain;
       overflow:auto;padding:18px}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheetHead h3{margin:0;font-size:16px}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink2);line-height:1}
.menu{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.menu .item{display:block;width:100%;text-align:left;font:inherit;font-size:14px;padding:11px 12px;border:0;border-radius:3px;
            background:none;color:var(--ink);cursor:pointer}
.menu .item:hover{background:var(--panel)}
.menu .item small{display:block;color:var(--ink3);font-size:11.5px;margin-top:1px}
.menu .item.danger{color:var(--hard)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.chunk{margin-top:12px}
.chunk textarea{width:100%;height:130px;font-family:var(--mono);font-size:11px;padding:8px;border:1px solid var(--rule);
                border-radius:3px;background:var(--panel);color:var(--ink)}

.drill{position:fixed;inset:0;background:var(--paper);z-index:60;display:flex;flex-direction:column}
.drillTop{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--rule);
         padding-top:calc(var(--s3) + env(safe-area-inset-top))}
.drillTop .undo{padding:9px 12px;font-size:17px;line-height:1;flex:none}
.drillTop .track{flex:1;height:4px;background:var(--rule);border-radius:3px;overflow:hidden}
.drillTop .fill{height:100%;background:var(--accent)}
.drillPos{font-family:var(--mono);font-size:12px;color:var(--ink3);white-space:nowrap}
.drillBody{flex:1;overflow:auto;overscroll-behavior:contain;padding:26px 18px 20px;max-width:680px;margin:0 auto;width:100%}
.drillHead{display:flex;gap:10px;align-items:center}
.drillHead .say{font-size:18px;padding:8px 11px}
.drillWord{font-family:var(--jp);font-size:46px;line-height:1.15;overflow-wrap:anywhere;min-width:0}
.drillRead{font-family:var(--jp);font-size:17px;color:var(--ink3);margin-top:4px}
.drillSent{font-family:var(--jp);font-size:17px;margin-top:16px;padding-left:12px;border-left:3px solid var(--rule)}
.drillStats{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:12px}

             padding-bottom:calc(12px + env(safe-area-inset-bottom))}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;
       padding:10px 16px;border-radius:3px;z-index:70;max-width:88vw;text-align:center}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;
     padding:0 4px;color:var(--ink3)}

/* ---------- телефон ----------
   Правила простые: ничего не вылезает за экран, палец попадает по кнопке
   с первого раза (44px), любое поле ввода не мельче 16px — иначе iOS
   при фокусе зумит страницу и она больше не влезает. */
@media (max-width:640px){

  #q{font-size:16px;padding:11px}

  /* полоса фильтров прокручивается вбок: справа оставляем поле, чтобы

  .line2{overflow-x:auto;flex-wrap:nowrap;padding-bottom:var(--s1);padding-right:var(--s4);

  .line2::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:40px;padding:0 14px;display:inline-flex;align-items:center}
  .line3{flex-wrap:wrap}
  .line3 .btn{flex:1 1 auto;min-height:44px}
  .btn.big{width:100%;min-height:48px}
  .say{min-width:44px;min-height:44px;font-size:17px}
  #sizeOwn{font-size:16px;min-height:44px}
  .lessons{max-height:40vh}
  .grades .btn{min-height:52px;padding:8px 6px;font-size:13px}
  .planNum{flex:1 1 72px}
  .kj{min-width:44px;min-height:44px;font-size:21px}
  .kjword{min-height:44px;font-size:16px}
  .kjbig{font-size:52px}
  .kjwrap{max-height:30vh}

  .ktile{min-height:96px}

  .row{grid-template-columns:3px 20px 1fr;gap:8px;padding:12px 2px;min-height:56px}

  .btn{min-height:44px;padding:10px 14px}
  .btn.ghost{min-height:40px}
  .simlist button{min-height:40px}

  /* окно — листом снизу: так до него дотягивается большой палец */
  .modal{place-items:end center;padding:0}
  .sheet{max-width:none;max-height:90vh;border-radius:14px 14px 0 0;border-bottom:0;
         padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  .sheetHead{position:sticky;top:-16px;background:var(--paper);padding-top:2px;z-index:1}
  .x{width:44px;height:44px;font-size:22px}
  .menu .item{padding:13px 12px;min-height:48px}

  .drillWord{font-size:38px}
  .drillBody{padding:20px 14px 16px}
  .drillBottom{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .drillBottom .btn{min-height:48px}
  .drillTop .btn{min-height:40px}

  .chunk textarea{font-size:16px;height:110px}
  #taskN{font-size:16px;min-height:40px;padding:6px}
  #promptBox{font-size:16px}
  input[type=checkbox]{width:20px;height:20px;margin:0 2px 0 0;flex:none}
  label.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px}

  .toast{max-width:calc(100vw - 24px);font-size:13.5px}
}
/* совсем узкие экраны — 320px и меньше */
@media (max-width:360px){
  #root{padding-left:10px;padding-right:10px}
  #sort{max-width:40%;font-size:16px}
  .drillWord{font-size:32px}
  .row{gap:6px}
}
/* телефон лёжа: экран низкий, шапку и отступы ужимаем */
@media (max-height:480px) and (orientation:landscape){
  #root{padding-top:8px}
  .controls{position:static}
  .drillWord{font-size:30px}
  .drillBody{padding-top:12px}
  .sheet{max-height:96vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

<script>
(function(){
"use strict";

/* ---------- хранилище: аккаунт Claude → IndexedDB → localStorage → память ---------- */
var mem={}, MODE="memory", LS=null, IDB=null;
try{ if(window.localStorage){ window.localStorage.setItem("__t","1"); window.localStorage.removeItem("__t"); LS=window.localStorage; } }catch(e){ LS=null; }

function idbOpen(){
  return new Promise(function(res,rej){
    if(!window.indexedDB) return rej(new Error("нет IndexedDB"));
    var rq=indexedDB.open("ankidash",1);
    rq.onupgradeneeded=function(){ var db=rq.result;
      if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv",{keyPath:"k"}); };
    rq.onsuccess=function(){ res(rq.result); };
    rq.onerror=function(){ rej(rq.error||new Error("IndexedDB недоступна")); };
  });
}
function idbReq(mode,fn){
  return new Promise(function(res,rej){
    var tx=IDB.transaction("kv",mode), st=tx.objectStore("kv"), r=fn(st);
    tx.oncomplete=function(){ res(r&&r.result); };
    tx.onerror=function(){ rej(tx.error); };
    tx.onabort=function(){ rej(tx.error); };
  });
}
async function initStorage(){
  if(window.storage&&window.storage.get){ MODE="app"; return; }
  try{ IDB=await idbOpen(); MODE="idb"; await migrateFromLS(); return; }catch(e){ IDB=null; }
  if(LS) MODE="local";
}
async function migrateFromLS(){
  if(!LS) return;
  var has=await idbReq("readonly",function(st){ return st.get("ankidash:meta"); });
  if(has) return;
  var moved=0;
  for(var i=0;i<LS.length;i++){
    var k=LS.key(i);
    if(k.indexOf("ankidash:")!==0) continue;
    await idbReq("readwrite",function(st){ return st.put({k:k,v:LS.getItem(k)}); });
    moved++;
  }
  if(moved) console.info("перенесено из localStorage:",moved);
}
async function sget(k){ try{
  if(MODE==="app"){ var r=await window.storage.get(k); return r?r.value:null; }
  if(MODE==="idb"){ var o=await idbReq("readonly",function(st){ return st.get(k); }); return o?o.v:null; }
  if(MODE==="local") return LS.getItem(k); }catch(e){} return mem[k]===undefined?null:mem[k]; }
async function sset(k,v){ try{
  if(MODE==="app"){ await window.storage.set(k,v); return true; }
  if(MODE==="idb"){ await idbReq("readwrite",function(st){ return st.put({k:k,v:v}); }); return true; }
  if(MODE==="local"){ LS.setItem(k,v); return true; } }catch(e){ return false; } mem[k]=v; return true; }
async function sdel(k){ try{
  if(MODE==="app"){ await window.storage.delete(k); return; }
  if(MODE==="idb"){ await idbReq("readwrite",function(st){ return st.delete(k); }); return; }
  if(MODE==="local"){ LS.removeItem(k); return; } }catch(e){} delete mem[k]; }
async function slist(p){ try{
  if(MODE==="app"){ var r=await window.storage.list(p); return r?r.keys.map(function(x){ return typeof x==="string"?x:x.key; }):[]; }
  if(MODE==="idb"){ var ks=await idbReq("readonly",function(st){ return st.getAllKeys(); }); 
    return (ks||[]).filter(function(k){ return String(k).indexOf(p)===0; }); }
  if(MODE==="local"){ var o=[]; for(var i=0;i<LS.length;i++){ var k=LS.key(i); if(k.indexOf(p)===0) o.push(k); } return o; } }catch(e){}
  return Object.keys(mem).filter(function(k){ return k.indexOf(p)===0; }); }

var HAS="ankidash:has";
function setHas(yes){ try{ if(LS) LS.setItem(HAS, yes?"1":"0"); }catch(e){} }
function hadCards(){ try{ return LS ? LS.getItem(HAS) : null; }catch(e){ return null; } }
var K={ meta:"ankidash:meta", cards:"ankidash:cards:", edits:"ankidash:edits",
        status:"ankidash:status", notes:"ankidash:notes", etym:"ankidash:etym", story:"ankidash:story",
        sent:"ankidash:sent", mtime:"ankidash:mtime", mtimes:"ankidash:mtimes", sync:"ankidash:sync",
        srs:"ankidash:srs", lesson:"ankidash:lesson", diff:"ankidash:diff", log:"ankidash:log",
        kanji:"ankidash:kanji", srsv:"ankidash:srsv" };

/* ---------- состояние ---------- */
var TIER={ A:12, B:8, C:4 };
var S={ cards:[], edits:{}, status:{}, notes:{}, etym:{}, story:{}, sent:{}, lastTask:null,
        mtime:{}, mtimes:{}, cardsAt:0, sync:{}, imports:[], deck:null,
        srs:{}, lesson:{}, diff:{}, log:{}, kanji:{}, kview:{f:"all",q:"",L:null}, size:20, back:true, voice:false, sound:true, devId:"",
        filters:{}, sort:"again", q:"", page:0, PAGE:60, open:null, cursor:-1,
        theme:"auto", drill:null, _vis:[], _idx:{read:{},kanji:{}}, _byId:{} };
var $=function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toast(m,ms){ var t=$("#toast"); t.textContent=m; t.hidden=false;
  clearTimeout(t._t); t._t=setTimeout(function(){ t.hidden=true; }, ms||2400); }

/* ---------- поля ---------- */
var EDITABLE_MAX=400, PREVIEW_MAX=700, DICT_MAX=4000, STORE_DICT_MAX=900;
function clean(v){
  if(v==null) return "";
  var s=String(v), i=s.indexOf(".yomitan-glossary");
  if(i>0) s=s.slice(0,i);
  return s.replace(/\[sound:[^\]]*\]/g,"").replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();
}
/* --- разбор словарных статей ---
   Экспорт Anki вырезал HTML, и пункты словаря склеились. Но структура восстановима:
   [1] [2] — номера значений, 。 — конец японского примера, дальше перевод. */
var POS=["usually written using kana alone","adverbial noun","auxiliary verb","pre-noun adjectival","suru verb",
 "onomatopoeic","abbreviation","interjection","conjunction","intransitive","na-adjective","no-adjective","i-adjective",
 "colloquial","expression","adjective","transitive","irregular","obsolete","numeric","particle","pronoun","archaic",
 "ichidan","adverb","prefix","suffix","godan","na-adj","no-adj","adj-na","adj-no","adj-i","i-adj","noun","5-dan","1-dan","suru"];
POS.sort(function(a,b){ return b.length-a.length; });
var POSRE=new RegExp("("+POS.join("|")+")","gi");
var SEP="\u0001";
function splitGlosses(g){
  return g.replace(POSRE,function(m){ return SEP+m+SEP; })
          .replace(/([a-zA-Z\)\]])(to [a-z])/g,"$1"+SEP+"$2")
          .replace(/([a-z\)\]])([A-Z])/g,"$1"+SEP+"$2")
          .split(SEP).map(function(x){ return x.trim(); }).filter(Boolean).join(" · ");
}
function tidyEn(s){
  return s.replace(/(Note|See also)([a-z\u3040-\u30FF\u4E00-\u9FFF])/g,"$1: $2")
          .replace(/([a-z\)\]!\?\.])([A-Z])/g,"$1 $2").trim();
}
function formatEn(s){
  var src="", m=s.match(/^\([^)]*\)\s*/); if(m){ src=m[0].trim(); s=s.slice(m[0].length); }
  s=s.replace(/(JMdict|Tatoeba|JMnedict)(\s*\|\s*(JMdict|Tatoeba|JMnedict))*\s*(\[\d+\])*\s*$/,"");
  var blocks=s.split(/\[\d+\]/), out=[], n=0;
  blocks.forEach(function(b){
    b=b.trim(); if(!b) return;
    var i=b.search(/[\u3040-\u30FF\u4E00-\u9FFF]/);
    var gl=(i<0?b:b.slice(0,i)).trim(), rest=(i<0?"":b.slice(i)).trim(), jp="", en="";
    if(rest){ var k=rest.lastIndexOf("。");
      if(k>=0){ jp=rest.slice(0,k+1); en=rest.slice(k+1).trim(); } else jp=rest; }
    if(!gl && !jp) return;
    n++;
    var line=n+". "+splitGlosses(gl);
    if(jp) line+="\n    "+tidyEn(jp);
    if(en) line+="\n    "+tidyEn(en);
    out.push(line);
  });
  return (out.join("\n")||splitGlosses(s))+(src?"\n\n"+src:"");
}
function formatJp(s){
  var src="", m=s.match(/^\([^)]*\)\s*/); if(m){ src=m[0].trim(); s=s.slice(m[0].length); }
  return s.replace(/(【[^】]*】)/g,"$1\n")
          .replace(/。/g,"。\n")
          .replace(/(［[^］]*］)/g,"\n$1 ")
          .replace(/(例文\d+件|使い方|語法|注意|Image)/g,"\n$1 ")
          .replace(/」「/g,"」\n「")
          .replace(/\n{2,}/g,"\n").trim()+(src?"\n\n"+src:"");
}
function guessLabel(samples){
  var s=""; for(var i=0;i<samples.length;i++){ if(samples[i]){ s=samples[i]; break; } }
  if(!s) return "";
  if(/^[\u3040-\u309F\u30A0-\u30FFー\s]+$/.test(s)) return "чтение";
  if(/^\[?\d+\]?$/.test(s)) return "число";
  if(/^(heiban|atamadaka|nakadaka|odaka|kifuku)/i.test(s)) return "акцент";
  if(/JMdict|Jitendex|Tatoeba|JMnedict/i.test(s)) return "словарь EN";
  if(/【|】|辞典|大辞|明鏡|新明解|広辞苑/.test(s)) return "словарь JP";
  if(/(BCCWJ|JPDB|freq)/i.test(s)) return "частотность";
  if(/(File \d|\.mp4|\.mkv|VidTube)/i.test(s)) return "источник";
  if(/\[[^\]]+\]/.test(s)) return s.length<24?"слово + фуригана":"пример + фуригана";
  if(/^[\u4E00-\u9FFF\u3040-\u30FF]{1,10}$/.test(s)) return "слово";
  if(/[。！？…]/.test(s) || s.length>25) return "пример";
  return "";
}
function isDict(l){ return l==="словарь EN"||l==="словарь JP"; }

/* ---------- колонки ---------- */
function pick(cols,names){
  for(var i=0;i<names.length;i++){ var n=names[i];
    for(var j=0;j<cols.length;j++) if(String(cols[j]).toLowerCase().replace(/^\ufeff/,"").trim()===n) return cols[j]; }
  return null;
}
function detect(cols){
  var c=cols.map(function(x){ return String(x).toLowerCase().replace(/^\ufeff/,"").trim(); });
  if(c.indexOf("ts_iso")>=0||c.indexOf("ts_ms")>=0) return "reviews";
  if(c.indexOf("review_date")>=0&&c.indexOf("review_count")>=0) return "skip";
  if(c.indexOf("difficulty_score")>=0||c.indexOf("leech_rule")>=0) return "skip";
  /* Экспорт статистики узнаём по его собственным колонкам — и раньше, чем по названию
     поля с разбором. У многих колод есть своё поле «Story» или «Этимология»:
     такой card_summary.csv принимался за ответ нейросети и не загружался вовсе,
     а человек видел «Сначала загрузите card_summary.csv» ровно тогда,
     когда он его и загружал. */
  var stats = c.indexOf("total_reviews")>=0 || c.indexOf("again_count")>=0 ||
              !!pick(cols,["again_rate","retention","retention_rate","lapses","errors"]);
  /* по карточкам или по колодам: у файла с колодами нет card_id */
  if(stats&&(c.indexOf("card_id")>=0||c.indexOf("total_reviews")>=0)) return "cards";
  /* разбор знаков: у него своя колонка kanji и нет card_id. Проверяем до «answer»,
     потому что колонки etymology и story есть и там, и там */
  if(pick(cols,["kanji","знак","иероглиф"])&&
     pick(cols,["meaning","значение","radicals","радикалы","mnemonic","мнемоника","readings","чтения"])) return "kanji";
  if(pick(cols,["этимология","etymology","разбор","story","интересное","история"])) return "answer";
  if(c.indexOf("deck_name")>=0&&c.indexOf("review_count")>=0) return "deck";
  if(stats) return "cards";
  return "unknown";
}
/* Ключ карточки. Раньше строки без card_id получали «row0», «row1» — и та же
   строка в другом файле становилась другой карточкой. Теперь ключ выводится из
   note_id или из самого слова: файл можно кидать хоть каждый день. */
function idOf(row,cId,cNote,fcols,r){
  var v=cId!=null?String(row[cId]==null?"":row[cId]).trim():"";
  if(v) return v;
  v=cNote!=null?String(row[cNote]==null?"":row[cNote]).trim():"";
  if(v) return "~n"+v;
  for(var i=0;i<fcols.length;i++){ var w=clean(row[fcols[i]]); if(w) return "~w"+w.slice(0,40); }
  return "~r"+r;
}
function buildCards(rows,cols){
  var cId=pick(cols,["card_id","cid","id"]), cNote=pick(cols,["note_id","nid","note"]),
      cDeck=pick(cols,["deck_name","deck"]), cRev=pick(cols,["total_reviews","reviews","reps","review_count"]),
      cAg=pick(cols,["again_count","lapses","errors"]), cRate=pick(cols,["again_rate","lapse_rate"]),
      cRet=pick(cols,["retention","retention_rate","success_rate"]),
      cTime=pick(cols,["average_review_time_ms","avg_time_ms","review_time_ms","avg_time"]),
      cLast=pick(cols,["last_review_date","last_review","last"]), cFirst=pick(cols,["first_review_date","first_review"]),
      cIvl=pick(cols,["latest_interval","interval","ivl"]);
  var known={}; [cId,cNote,cDeck,cRev,cAg,cRate,cRet,cTime,cLast,cFirst,cIvl,"deck_id"].forEach(function(x){ if(x) known[x]=1; });
  var fcols=cols.filter(function(x){ return x && !known[x]; });
  var samples={}; fcols.forEach(function(f){ samples[f]=[]; });
  for(var i=0;i<Math.min(rows.length,30);i++) fcols.forEach(function(f){ samples[f].push(clean(rows[i][f])); });
  var labels={}; fcols.forEach(function(f){ labels[f]=guessLabel(samples[f]); });
  var out=[];
  var noId=0;
  for(var r=0;r<rows.length;r++){
    var row=rows[r], id=idOf(row,cId,cNote,fcols,r); if(id.charAt(0)==="~") noId++;
    var n=parseFloat(row[cRev]); if(!isFinite(n)) n=0;
    var a=parseFloat(row[cAg]);
    if(!isFinite(a)){ var rt=parseFloat(row[cRate]);
      if(!isFinite(rt)&&cRet!=null){ var rr=parseFloat(row[cRet]); if(isFinite(rr)) rt=rr>1?1-rr/100:1-rr; }
      a=isFinite(rt)?Math.round(rt*n):0; }
    var t=parseFloat(row[cTime]); if(!isFinite(t)) t=0;
    var fields=[];
    for(var k=0;k<fcols.length;k++){
      var lab=labels[fcols[k]], raw=clean(row[fcols[k]]);
      if(!raw) continue;
      if(isDict(lab)) fields.push({ key:fcols[k], label:lab, ed:false, dict:true,
        v: lab==="словарь EN" ? formatEn(raw.slice(0,DICT_MAX)) : formatJp(raw.slice(0,DICT_MAX)) });
      else { var ed=raw.length<=EDITABLE_MAX;
        fields.push({ key:fcols[k], label:lab, ed:ed, v: ed?raw:raw.slice(0,PREVIEW_MAX) }); }
    }
    out.push({ id:id, note:String(row[cNote]!=null?row[cNote]:id), deck:row[cDeck]||"", n:n, a:a, rate:n?a/n:0, t:t,
      last:(row[cLast]||"").slice(0,10), first:(row[cFirst]||"").slice(0,10), ivl:parseFloat(row[cIvl])||0, f:fields });
  }
  out.noId=noId;
  return out;
}

/* ---------- важность ---------- */
function doneAt(id){ var m=S.mtimes.status; return (m&&m[id])||0; }
function tierOf(c){ return c.a>=TIER.A?"A":(c.a>=TIER.B?"B":(c.a>=TIER.C?"C":"D")); }
function colorOf(c){ var t=tierOf(c); return t==="A"?"var(--hard)":(t==="B"?"var(--mid)":(t==="C"?"var(--soft)":"var(--easy)")); }
function score(c){ return (c.a+1.5)/(c.n+5); }

/* ---------- звук ----------
   Голос берём из системы: ничего не качается, работает офлайн и в самолёте.
   Японского голоса в системе может не быть — тогда кнопки просто нет. */
var voiceJa=null;
function pickVoice(){
  try{
    var v=window.speechSynthesis?speechSynthesis.getVoices():[];
    voiceJa=null;
    for(var i=0;i<v.length;i++) if(/^ja/i.test(v[i].lang)){ voiceJa=v[i]; break; }
  }catch(e){ voiceJa=null; }
  return voiceJa;
}
function canSpeak(){ return !!(window.speechSynthesis&&(voiceJa||pickVoice())); }
function speak(text){
  if(!text||!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(text).slice(0,140));
    u.lang="ja-JP"; if(voiceJa||pickVoice()) u.voice=voiceJa;
    u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function sayBtn(text){
  if(!canSpeak()||!text) return "";
  return '<button class="say" data-say="'+esc(text)+'" title="Произнести" aria-label="Произнести">🔊</button>';
}
try{ if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; } }catch(e){}

/* ---------- сигналы ----------

   Три коротких звука, больше не нужно. Синтезируем на месте: ни одного файла,
   ноль веса, работает офлайн. Гармонически сложный звук читается как «важно» —
   для подтверждения рутинного действия он не годится, поэтому тут чистые тоны,
   тихо и коротко. Провал звучит нейтрально, а не наказующе. */
var actx=null;
function audio(){
  if(actx) return actx;
  try{ var C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); }catch(e){ actx=null; }
  return actx;
}
function tone(freq,start,dur,vol){
  var a=audio(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain();
  o.type="sine"; o.frequency.value=freq;
  var t=a.currentTime+start;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}
var SOUNDS={
  ok:   function(){ tone(660,0,0.09,0.05); tone(880,0.045,0.10,0.045); },
  miss: function(){ tone(300,0,0.11,0.045); },
  done: function(){ tone(523.25,0,0.16,0.05); tone(659.25,0.10,0.16,0.05); tone(783.99,0.20,0.34,0.055); }
};
function ding(name){
  if(S.sound===false) return;
  var f=SOUNDS[name]; if(!f) return;
  try{ var a=audio(); if(a&&a.state==="suspended") a.resume(); f(); }catch(e){}
}

/* ---------- уроки: формула, разбивка, расписание ----------

   Насколько карточка мешает жить. Считаем три вещи, которые есть в экспорте:
   сколько раз провалена, какая доля провалов и насколько тяжело даётся ответ.
   Число провалов — главное: именно оно и есть «что я фэйлю». */
function weightOf(c){
  var rate=c.n?c.a/c.n:0;
  var slow=Math.min((c.t||0)/12000,1.5);          // 12 секунд ответа — уже долго
  return c.a*(0.6+rate)*(1+slow*0.4);
}
/* Разбивка на уроки делается один раз и держится: иначе после каждой выгрузки
   статистики уроки бы перетасовывались и «закрытых» было бы не собрать.
   Новые карточки просто дописываются в конец плана. */
function lessonSize(){ var n=+S.size||20; return n>0?n:20; }
/* У разбивки по урокам своё время правки на карточку. Без него смена
   размера урока на одном устройстве частично откатывалась старым планом
   из хранилища: слияние сравнивало номера уроков по чужому часу. */
function touchLesson(id){
  if(!S.mtimes.lesson) S.mtimes.lesson={};
  S.mtimes.lesson[id]=Date.now();
  S.sync.dirty=true;
}
function assignLessons(){
  var size=lessonSize(), used={}, maxN=0, i;
  for(i=0;i<S.cards.length;i++){
    var ln=S.lesson[S.cards[i].id];
    if(ln>0){ used[ln]=(used[ln]||0)+1; if(ln>maxN) maxN=ln; }
  }
  var free=[];
  for(i=0;i<S.cards.length;i++) if(!(S.lesson[S.cards[i].id]>0)) free.push(S.cards[i]);
  if(!free.length) return 0;
  free.sort(function(a,b){ return weightOf(b)-weightOf(a); });
  /* сначала добиваем неполные уроки, потом заводим новые */
  var num=1, added=0;
  for(i=0;i<free.length;i++){
    while(num<=maxN&&(used[num]||0)>=size) num++;
    if(num>maxN){ maxN=num; }
    S.lesson[free[i].id]=num; touchLesson(free[i].id);
    used[num]=(used[num]||0)+1; added++;
  }
  return added;
}
function lessonsList(){
  var by={}, i;
  for(i=0;i<S.cards.length;i++){
    var c=S.cards[i], ln=S.lesson[c.id];
    if(!(ln>0)) continue;
    if(!by[ln]) by[ln]={ n:ln, cards:[], новых:0, кповтору:0, готово:0 };
    by[ln].cards.push(c);
    var st=S.srs[c.id];
    if(!st) by[ln].новых++;
    else if(dueIn(c.id)<=0) by[ln].кповтору++;
    else by[ln].готово++;
  }
  return Object.keys(by).map(function(k){ return by[k]; })
    .sort(function(a,b){ return a.n-b.n; });
}
/* Расписание Anki со штатными настройками, без FSRS.

   Состояние карточки: q — фаза (learn — учится, review — на повторе,
   relearn — переучивается после провала), s — номер шага обучения,
   i — интервал в днях, e — лёгкость, r — сколько раз отвечали,
   l — сколько раз провалено, d — когда показать снова.

   Шаги обучения в Anki меряются минутами. Здесь урок — конечный список,
   поэтому минуты переводятся в «через столько-то карточек»: одна минута —
   почти сразу, десять — ближе к концу урока. */
var ANKI={
  steps:[1,10],      // шаги обучения, минуты
  relearn:[10],      // шаг переучивания после провала
  grad:1,            // выпуск: первый интервал, дней
  ease0:2.5,         // стартовая лёгкость
  easeMin:1.3,
  hard:1.2,          // множитель для «с трудом»
  mod:1.0,           // интервальный модификатор
  lapse:0.0,         // новый интервал после провала — от прежнего
  lapseMin:1,        // но не меньше дня
  max:36500
};
var DAY=86400000;
function today(){ var d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function dueIn(id){ var st=S.srs[id]; if(!st) return -1; return Math.round((st.d-today())/DAY); }
function isDue(id){ var st=S.srs[id]; return !!st&&st.d<=today()+DAY-1; }
/* Сколько веса приносит ответ. Повтор дешевле первого взятия, провал — ноль,
   но карточка вернётся, и вес придёт тогда. */
function gainOf(c,g,был){
  if(g===0) return 0;
  return Math.round(weightOf(c)*(g===1?0.6:1)*(был?0.6:1));
}
function grade(id,g){
  var было=S.srs[id]||null;
  var был=!!было, держит=был&&(было.i||0)>=7&&isDue(id)&&g>0;
  var c=S._byId[id];
  if(c) logAdd({ w:gainOf(c,g,был), n:g>0?1:0, h:держит?1:0 });
  var n=nextState(было,g);
  S.srs[id]=n.st;
  touch(id,"srs");
  /* карточка выпустилась и уехала на дни — считаем её проработанной,
     чтобы прежние счётчики и фильтры остались осмысленными */
  if(n.mins===0&&n.st.i>=1&&S.status[id]!=="done"){ S.status[id]="done"; touch(id,"status"); }
  return n;
}
/* Отметил проработанной руками — карточка не должна пропадать навсегда:
   ставим её в то же расписание, как будто ответили «помню». */
function scheduleIfNew(id){
  if(S.srs[id]) return;
  S.srs[id]={ q:"review", s:0, i:ANKI.grad, e:ANKI.ease0, r:1, l:0, d:today()+ANKI.grad*DAY };
  touch(id,"srs");
}
/* ---------- дневник ----------

   Опыт здесь — не начисление, а измерение: сколько тяжести снято с колоды.
   Вес тот же, по которому карточки разложены на уроки, поэтому число нельзя
   нафармить на лёгком и оно не врёт. Провал не отнимает — просто пока не даёт:
   карточка вернётся в этом же уроке, и вес придёт, когда вы её возьмёте.

   Записи дневника помечены и датой, и устройством: два телефона за один день
   пишут в разные строки, поэтому при обмене ничего не затирается и не двоится. */
function dayKey(t){ var d=new Date(t||Date.now());
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function devId(){
  if(!S.devId){ S.devId=Math.random().toString(36).slice(2,8); saveMeta(); }
  return S.devId;
}
function logKey(){ return dayKey()+"|"+devId(); }
function logAdd(add){
  var k=logKey(), e=S.log[k]||{ w:0, n:0, l:0, h:0 };
  e.w=(e.w||0)+(add.w||0); e.n=(e.n||0)+(add.n||0);
  e.l=(e.l||0)+(add.l||0); e.h=(e.h||0)+(add.h||0);
  S.log[k]=e; touch(k,"log");
  /* дневник не должен расти бесконечно */
  var keys=Object.keys(S.log);
  if(keys.length>400){ keys.sort(); for(var i=0;i<keys.length-400;i++) delete S.log[keys[i]]; }
}
/* суммируем по дню всё, что записали разные устройства */
function logByDay(){
  var by={};
  Object.keys(S.log).forEach(function(k){
    var d=k.split("|")[0], e=S.log[k]||{};
    if(!by[d]) by[d]={ день:d, w:0, n:0, l:0, h:0 };
    by[d].w+=e.w||0; by[d].n+=e.n||0; by[d].l+=e.l||0; by[d].h+=e.h||0;
  });
  return by;
}
function lastDays(k){
  var by=logByDay(), out=[], t=Date.now();
  for(var i=k-1;i>=0;i--){
    var d=dayKey(t-i*DAY);
    out.push(by[d]||{ день:d, w:0, n:0, l:0, h:0 });
  }
  return out;
}
/* Сколько дней подряд были занятия. Показываем только когда есть,
   и никогда не показываем потерю: серия должна тянуть, а не пугать. */
function streak(){
  var by=logByDay(), k=0, t=Date.now();
  if(!(by[dayKey(t)]&&by[dayKey(t)].n)) t-=DAY;      // сегодня ещё не поздно
  while(true){ var e=by[dayKey(t)]; if(!e||!e.n) break; k++; t-=DAY; }
  return k;
}
function totalWeight(){
  var w=0; Object.keys(S.log).forEach(function(k){ w+=(S.log[k].w||0); });
  return Math.round(w);
}
/* Рекорд не хранится: он выводится из данных, значит не может разойтись с ними */
function heaviestDone(){
  var best=null;
  for(var i=0;i<S.cards.length;i++){ var c=S.cards[i], st=S.srs[c.id];
    if(!st||!st.r) continue;
    if(!best||weightOf(c)>weightOf(best)) best=c; }
  return best;
}
/* Переход на расписание Anki. Прежние интервалы считались по другому правилу
   и разъехались до сотен дней, поэтому расписание сбрасывается один раз:
   карточки снова становятся новыми и проходят шаги обучения заново.
   Разборы, заметки, знаки, планы уроков и дневник не трогаются.

   Аванса при этом не выдаём: он бы тут же вернул сброшенные карточки на
   недельные интервалы и отменил сам сброс. */
async function resetSchedule(){
  if(await sget(K.srsv)==="2") return 0;
  var было=Object.keys(S.srs).length;
  S.srs={}; S.mtimes.srs={};
  await sset(K.srsv,"2");
  if(было){ await sset(K.srs,"{}"); await sset(K.mtimes,JSON.stringify(S.mtimes)); }
  return было;
}
/* Состояния из версии до перехода узнаются по форме — у них нет фазы q.
   Такие выбрасываем всегда, в том числе когда их принесла синхронизация
   со второго устройства, которое ещё не обновилось. */
function dropOldSrs(){
  var n=0, mt=S.mtimes.srs||{};
  Object.keys(S.srs).forEach(function(id){
    if(!S.srs[id]||!S.srs[id].q){ delete S.srs[id]; delete mt[id]; n++; }
  });
  return n;
}
function dueCards(){
  var out=[];
  for(var i=0;i<S.cards.length;i++){ var c=S.cards[i];
    if(S.srs[c.id]&&isDue(c.id)) out.push(c); }
  out.sort(function(a,b){ return (S.srs[a.id].d-S.srs[b.id].d)||(weightOf(b)-weightOf(a)); });
  return out;
}
/* Прогноз по своему же темпу за последнюю неделю — это планирование,
   а не давление: цифра сообщает, а ничего не требует. */
/* Понедельничный итог: один раз за неделю, тихо, без требований. */
function weekKey(t){
  var d=new Date(t||Date.now());
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()+4-(d.getDay()||7));
  var y0=new Date(d.getFullYear(),0,1);
  return d.getFullYear()+"-"+Math.ceil((((d-y0)/DAY)+1)/7);
}
function weekSummary(){
  var cur=weekKey();
  if(S.week===cur) return;
  var was=S.week; S.week=cur; saveMeta();
  if(!was) return;                                  // первая неделя — молчим
  var by=logByDay(), w=0, n=0, l=0;
  Object.keys(by).forEach(function(d){
    if(weekKey(new Date(d+"T12:00:00").getTime())!==was) return;
    var e=by[d]; w+=e.w; n+=e.n; l+=e.l;
  });
  if(!n) return;
  toast("На прошлой неделе: "+скл(l,"урок","урока","уроков")+", "+
        скл(n,"карточка","карточки","карточек")+", снято веса "+w, 6000);
}
function paceForecast(){
  var d=lastDays(7), sum=0, дней=0;
  d.forEach(function(x){ sum+=x.n; if(x.n) дней++; });
  if(!sum) return null;
  var вдень=sum/7, p=planCounts();
  if(!p.новых||вдень<=0) return null;
  var надо=Math.ceil(p.новых/вдень);
  if(надо>720) return null;
  var t=new Date(Date.now()+надо*DAY);
  return { дней:надо, когда:t.toLocaleDateString("ru-RU",{day:"numeric",month:"long"}) };
}
function tierACount(){
  var k=0; for(var i=0;i<S.cards.length;i++) if(tierOf(S.cards[i])==="A") k++;
  return k;
}
function planCounts(){
  var novel=0, due=0, all=0;
  for(var i=0;i<S.cards.length;i++){ var id=S.cards[i].id;
    if(!(S.lesson[id]>0)) continue;
    all++;
    if(!S.srs[id]) novel++; else if(isDue(id)) due++; }
  return { новых:novel, кповтору:due, всего:all };
}

/* ---------- файлы ---------- */
function parseFile(file,onProgress){
  return new Promise(function(res,rej){
    if(/\.json$/i.test(file.name)){
      var fr=new FileReader();
      fr.onload=function(){ try{ var j=JSON.parse(fr.result);
        var rows=Array.isArray(j)?j:(j.cards||j.rows||j.data||j.items||[]);
        res({ rows:rows, cols: rows.length?Object.keys(rows[0]):[] }); }catch(e){ rej(e); } };
      fr.onerror=function(){ rej(new Error("файл не читается")); };
      fr.readAsText(file); return;
    }
    var rows=[],cols=null,seen=0;
    Papa.parse(file,{ header:true, skipEmptyLines:true, chunkSize:1024*1024*2,
      transformHeader:function(h){ return String(h).replace(/^\ufeff/,"").trim(); },
      chunk:function(r){ if(!cols) cols=r.meta.fields||[];
        for(var i=0;i<r.data.length;i++) rows.push(r.data[i]);
        seen+=r.data.length; if(onProgress) onProgress(file.name+": "+seen.toLocaleString("ru-RU")+" строк"); },
      complete:function(){ res({ rows:rows, cols:cols||[] }); },
      error:function(e){ rej(e); } });
  });
}
function mergeCards(inc,stamp){
  var idx={},i; for(i=0;i<S.cards.length;i++) idx[S.cards[i].id]=S.cards[i];
  var added=0,moved=0,seen={};
  for(i=0;i<inc.length;i++){
    var nc=inc[i], e=idx[nc.id]; seen[nc.id]=1;
    if(!e){ nc.added=stamp; nc.dn=0; S.cards.push(nc); idx[nc.id]=nc; added++; continue; }
    var dn=nc.n-e.n;
    /* было e.dn=dn только при dn>0 — и старая пометка «+7 повт.» висела
       на карточке после следующих выгрузок, где ничего не менялось */
    if(dn>0){ e.dn=dn; e.da=Math.max(0,nc.a-e.a); moved++; }
    else { e.dn=0; e.da=0; }
    e.n=nc.n; e.a=nc.a; e.rate=nc.rate; e.t=nc.t; e.ivl=nc.ivl;
    e.last=nc.last||e.last; e.first=e.first||nc.first; e.deck=nc.deck||e.deck;
    var byKey={}; for(var k=0;k<e.f.length;k++) byKey[e.f[k].key]=e.f[k];
    for(var j=0;j<nc.f.length;j++){ var nf=nc.f[j], of=byKey[nf.key];
      if(of){ of.v=nf.v; of.ed=nf.ed; of.dict=nf.dict; of.label=of.label||nf.label; } else e.f.push(nf); }
  }
  /* карточки, которых в этом файле не оказалось: удалили в Anki или экспорт
     был по части колоды. Сами не трогаем — разборы к ним никуда не деваются */
  var gone=0; for(i=0;i<S.cards.length;i++) if(!seen[S.cards[i].id]) gone++;
  return { added:added, moved:moved, gone:gone };
}
function mergeAnswer(rows,cols){
  var cE=pick(cols,["этимология","etymology","разбор"]), cS=pick(cols,["story","интересное","история","факт"]);
  var cId=pick(cols,["card_id","cid","id"]), cNote=pick(cols,["note_id","nid"]), cW=pick(cols,["слово","word","expression","term"]);
  var byId={},byNote={},byWord={};
  S.cards.forEach(function(c){ byId[c.id]=c; byNote[c.note]=c; var w=mainText(c); if(w&&!byWord[w]) byWord[w]=c; });
  var ok=0,miss=0;
  rows.forEach(function(r){
    var et=cE?String(r[cE]==null?"":r[cE]).trim():"", st=cS?String(r[cS]==null?"":r[cS]).trim():"";
    if(!et && !st) return;
    var c=(cId&&byId[String(r[cId]).trim()])||(cNote&&byNote[String(r[cNote]).trim()])||(cW&&byWord[String(r[cW]).trim()]);
    if(!c){ miss++; return; }
    if(et){ S.etym[c.id]=et; touch(c.id,"etym"); }
    if(st){ S.story[c.id]=st; touch(c.id,"story"); }
    ok++;
  });
  return { ok:ok, miss:miss };
}
async function handleFiles(files){
  var prog=$("#progress"), say=function(m){ prog.textContent=m; toast(m,4000); };
  var cards=null, ans=null, deck=null, kan=null;
  for(var i=0;i<files.length;i++){
    var f=files[i]; prog.textContent="Читаю "+f.name+"…";
    try{
      var p=await parseFile(f,function(m){ prog.textContent=m; });
      var kind=detect(p.cols);
      if(kind==="reviews"||kind==="skip"){ say(f.name+": этот файл не нужен, пропускаю"); continue; }
      if(kind==="kanji"){ kan=mergeKanji(p.rows,p.cols); continue; }
      if(kind==="answer"){
        if(!S.cards.length){ say("Сначала загрузите card_summary.csv"); continue; }
        ans=mergeAnswer(p.rows,p.cols); continue;
      }
      if(kind==="cards"&&!cards) cards=p;
      else if(kind==="deck") deck=p;
      else say(f.name+": не понял формат");
    }catch(e){ say(f.name+": не разобрать — "+e.message); }
  }
  if(deck&&deck.rows.length) S.deck=deck.rows[0];
  if(cards){
    prog.textContent="Сверяю с тем, что уже есть…";
    var stamp=new Date().toISOString().slice(0,10);
    var built=buildCards(cards.rows,cards.cols), noId=built.noId||0;
    var res=mergeCards(built,stamp);
    assignLessons();                     // новые карточки дописываются в конец плана
    S.cardsAt=Date.now();
    S.sync.dirty=true;                   // свежий экспорт тоже надо отдать
    S.imports.unshift({ at:stamp, added:res.added, moved:res.moved, a:tierACount() });
    S.imports=S.imports.slice(0,20);
    buildIndex();
    prog.textContent="Сохраняю…";
    await saveAll();
    say((res.added?"Новых: "+res.added+", обновлено: "+res.moved:"Обновлено: "+res.moved)+
        (res.gone?", нет в этом файле: "+res.gone:"")+
        (noId?", строк без card_id: "+noId:""));
    S.page=0;
  }
  if(ans){ buildIndex(); await saveAll(); say("Разборов добавлено: "+ans.ok+(ans.miss?", не нашёл карточку для "+ans.miss:"")); }
  if(kan){ await saveTexts(); say("Знаков разобрано: "+kan.ok+(kan.miss?", пропущено строк: "+kan.miss:"")); }
  renderAll();
}

/* ---------- сохранение ---------- */
var CHUNK=300;
function meta(){ return { v:7, at:Date.now(), chunks:Math.ceil(S.cards.length/CHUNK), deck:S.deck,
  imports:S.imports, theme:S.theme, sort:S.sort, lastTask:S.lastTask, cardsAt:S.cardsAt||0,
  size:lessonSize(), sizeAt:S.sizeAt||0, back:S.back!==false, voice:!!S.voice,
  sound:S.sound!==false, devId:S.devId||"", week:S.week||"" }; }
async function saveMeta(){ setHas(S.cards.length>0); return await sset(K.meta,JSON.stringify(meta())); }
/* _s — строка для поиска, её собирает buildIndex при загрузке. Хранить её незачем,
   а весит она как все словари вместе взятые. */
function bare(c){ var o={}; for(var k in c) if(k!=="f"&&k!=="_s") o[k]=c[k]; return o; }
function pack(cards){ return cards.map(function(c){
  var o=bare(c);
  o.f=c.f.map(function(f){ return f.dict?{key:f.key,label:f.label,ed:false,dict:true,v:f.v.slice(0,STORE_DICT_MAX)}:f; });
  return o; }); }
function slim(cards){ return cards.map(function(c){
  var o=bare(c);
  o.f=c.f.filter(function(f){ return f.ed; }).map(function(f){ return {key:f.key,label:f.label,ed:true,v:f.v.slice(0,300)}; });
  return o; }); }
async function saveAll(){
  var need=Math.ceil(S.cards.length/CHUNK), ok=true;
  var old=await slist(K.cards);
  for(var i=0;i<old.length;i++){ var num=parseInt(old[i].slice(K.cards.length),10);
    if(!(num>=0&&num<need)) await sdel(old[i]); }
  for(var c=0;c<need;c++){
    var part=S.cards.slice(c*CHUNK,(c+1)*CHUNK);
    var w=await sset(K.cards+c,JSON.stringify(pack(part)));
    if(!w) w=await sset(K.cards+c,JSON.stringify(slim(part)));
    if(!w) ok=false;
  }
  ok=(await saveMeta())&&ok;
  await sset(K.edits,JSON.stringify(S.edits));
  await sset(K.status,JSON.stringify(S.status));
  await sset(K.notes,JSON.stringify(S.notes));
  await sset(K.etym,JSON.stringify(S.etym));
  await sset(K.story,JSON.stringify(S.story));
  await sset(K.sent,JSON.stringify(S.sent));
  await sset(K.srs,JSON.stringify(S.srs));
  await sset(K.lesson,JSON.stringify(S.lesson));
  await sset(K.diff,JSON.stringify(S.diff));
  await sset(K.log,JSON.stringify(S.log));
  await sset(K.kanji,JSON.stringify(S.kanji));
  await sset(K.mtime,JSON.stringify(S.mtime));
  await sset(K.mtimes,JSON.stringify(S.mtimes));
  await sset(K.sync,JSON.stringify(S.sync));
  if(!ok) toast("Хранилище переполнено: словари не сохранены, тексты на месте",5000);
  return ok;
}

var saveT=null;
/* время правки: общее по карточке (старый формат) и отдельное по полю —
   по нему при слиянии видно, что именно здесь стёрли, а что просто не заводили */
function touch(id,key){
  var now=Date.now();
  if(key){ if(!S.mtimes[key]) S.mtimes[key]={}; S.mtimes[key][id]=now; }
  if(key!=="edits") S.mtime[id]=now;
  S.sync.dirty=true;                     // накопилось своё — отдадим при первом же случае
}
function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(async function(){
  await sset(K.edits,JSON.stringify(S.edits)); await sset(K.status,JSON.stringify(S.status));
  await sset(K.notes,JSON.stringify(S.notes)); await sset(K.etym,JSON.stringify(S.etym));
  await sset(K.story,JSON.stringify(S.story)); await sset(K.sent,JSON.stringify(S.sent));
  await sset(K.srs,JSON.stringify(S.srs)); await sset(K.lesson,JSON.stringify(S.lesson));
  await sset(K.diff,JSON.stringify(S.diff)); await sset(K.log,JSON.stringify(S.log));
  await sset(K.kanji,JSON.stringify(S.kanji));
  await sset(K.mtime,JSON.stringify(S.mtime)); await sset(K.mtimes,JSON.stringify(S.mtimes));
  await sset(K.sync,JSON.stringify(S.sync));
  await saveMeta();
  announce(); syncSoon(); },700); }

/* ---------- содержимое ---------- */
function valOf(c,f){ var e=S.edits[c.note]; return (e&&e[f.key]!=null)?e[f.key]:f.v; }
function isEdited(c){ var e=S.edits[c.note]; return !!(e&&Object.keys(e).length); }
function setEdit(c,key,val,orig){
  if(val===orig){ if(S.edits[c.note]){ delete S.edits[c.note][key];
      if(!Object.keys(S.edits[c.note]).length) delete S.edits[c.note]; } }
  else { if(!S.edits[c.note]) S.edits[c.note]={}; S.edits[c.note][key]=val; }
  touch(c.note,"edits");
  saveSoon();
}
function byLabel(c,l){ for(var i=0;i<c.f.length;i++) if(c.f[i].label===l) return valOf(c,c.f[i]); return ""; }
function mainText(c){ return c.f.length?valOf(c,c.f[0]):""; }
function exampleText(c){
  var best="";
  for(var i=1;i<c.f.length;i++){ var f=c.f[i]; if(f.dict) continue; var v=valOf(c,f);
    if(f.label==="пример"&&(!best||v.length<best.length)) best=v; }
  if(best) return best;
  for(var j=1;j<c.f.length;j++){ var g=c.f[j]; if(g.dict) continue; var w=valOf(c,g);
    if(w.length>12&&g.label!=="частотность") return w; }
  return "";
}
function dictOf(c,w){ return byLabel(c,w==="en"?"словарь EN":"словарь JP"); }
function etymOf(c){ return (S.etym[c.id]||"").trim(); }
function storyOf(c){ return (S.story[c.id]||"").trim(); }

/* текст разбора: абзацы, выделения **…**, пометки в начале абзаца, японский своим шрифтом */
function prose(t){
  var h=esc(t)
    .replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")
    .replace(/^([А-ЯЁA-Z][^:\n]{2,28}):(\s|$)/gm,"<strong>$1:</strong>$2")
    .replace(/^\s*[-—•]\s+/gm,"— ")
    .replace(/([\u3040-\u30FF\u4E00-\u9FFF][\u3040-\u30FF\u4E00-\u9FFF\u3005\u30FC]*)/g,'<span class="jp" lang="ja">$1</span>');
  return h.split(/\n{2,}/).map(function(p){ return "<p>"+p.replace(/\n/g,"<br>")+"</p>"; }).join("");
}

/* ---------- похожие ---------- */
function buildIndex(){
  var R={},KJ={},BY={};
  for(var i=0;i<S.cards.length;i++){
    var c=S.cards[i], rd=byLabel(c,"чтение"), w=mainText(c);
    BY[c.id]=c;
    if(rd) (R[rd]=R[rd]||[]).push(c.id);
    var kj=w.match(/[\u4E00-\u9FFF]/g)||[];
    for(var k=0;k<kj.length;k++) (KJ[kj[k]]=KJ[kj[k]]||[]).push(c.id);
    /* строка для поиска собирается один раз, а не на каждое нажатие клавиши */
    var buf=[];
    for(var j=0;j<c.f.length;j++){ var f=c.f[j];
      buf.push(f.dict ? f.v.slice(0,400) : valOf(c,f)); }
    c._s=buf.join(" ").toLowerCase();
  }
  S._idx={read:R,kanji:KJ}; S._byId=BY;
  /* срединные время ответа и доля провалов — по ним видно, что даётся туго,
     хотя и без ошибок: долгий ответ означает хрупкую память */
  var ts=[], rs=[];
  for(i=0;i<S.cards.length;i++){ var x=S.cards[i];
    if(x.t>0) ts.push(x.t); if(x.n>0) rs.push(x.a/x.n); }
  var mid=function(a){ if(!a.length) return 0; a.sort(function(p,q){ return p-q; });
    return a[Math.floor(a.length/2)]; };
  S._med={ t:mid(ts), rate:mid(rs) };
}
function reindexCard(c){
  var buf=[];
  for(var j=0;j<c.f.length;j++){ var f=c.f[j]; buf.push(f.dict?f.v.slice(0,400):valOf(c,f)); }
  c._s=buf.join(" ").toLowerCase();
}
/* Главная причина залипших карточек — не сложность, а путаница между похожими.
   Лечится не зубрёжкой, а проговоренным различием, поэтому оно хранится
   на паре, а не на карточке: написал один раз — видно с обеих сторон. */
function pairKey(a,b){ return a<b ? a+"|"+b : b+"|"+a; }
function diffOf(a,b){ return (S.diff[pairKey(a,b)]||"").trim(); }
function setDiff(a,b,v){
  var k=pairKey(a,b); v=String(v||"").trim();
  if(v) S.diff[k]=v; else delete S.diff[k];
  touch(k,"diff"); saveSoon();
}
function similarOf(c){
  var byId=S._byId, homo=[], kin=[], seen={}; seen[c.id]=1;
  var rd=byLabel(c,"чтение");
  if(rd) (S._idx.read[rd]||[]).forEach(function(id){
    if(seen[id]||!byId[id]) return; seen[id]=1; homo.push({c:byId[id],why:"то же чтение"}); });
  var kj=(mainText(c).match(/[\u4E00-\u9FFF]/g)||[]), sh={};
  kj.forEach(function(ch){ (S._idx.kanji[ch]||[]).forEach(function(id){
    if(seen[id]) return; if(!sh[id]) sh[id]={n:0,ch:ch}; sh[id].n++; }); });
  Object.keys(sh).forEach(function(id){ var o=byId[id]; if(o&&o.a>=TIER.C) kin.push({c:o,why:sh[id].ch,n:sh[id].n}); });
  kin.sort(function(a,b){ return (b.n-a.n)||(b.c.a-a.c.a); });
  return homo.slice(0,4).concat(kin.slice(0,Math.max(0,5-Math.min(homo.length,4))));
}


/* ---------- знаки ----------

   Кандзи — то, что общее у половины залипших карточек: один и тот же знак
   тянет вниз десяток слов. Поэтому у него своя карточка, и она отвечает
   на вопрос «где он мне мешает»: список слов из вашей же колоды считается
   сам, по индексу, который уже собран для «похожих».

   Значение, радикалы, этимология, история, мнемоника и порядок черт —
   ваши тексты. Пишете сами или собираете нейросетью: ⋯ → Задание по кандзи.
   Никаких встроенных словарей — ничего не качается и ничего не весит. */
var KRE=/[\u4E00-\u9FFF]/g;
function kanjiOf(ch){ return S.kanji[ch]||{}; }
function hasKanji(ch){ var d=S.kanji[ch]; return !!(d&&(d.m||d.e||d.n||d.r)); }
/* Слова колоды с этим знаком — от самых тяжёлых к лёгким. */
function kanjiWords(ch){
  var ids=(S._idx.kanji&&S._idx.kanji[ch])||[], seen={}, out=[];
  for(var i=0;i<ids.length;i++){
    var c=S._byId[ids[i]];
    if(!c||seen[c.id]) continue;
    seen[c.id]=1; out.push(c);
  }
  out.sort(function(a,b){ return weightOf(b)-weightOf(a); });
  return out;
}
/* Сколько тяжести тянет на себе знак: сумма весов слов, где он стоит.
   По этому числу знаки и выстраиваются в задании — сначала те, что мешают больше. */
function kanjiLoad(ch){
  var w=kanjiWords(ch), sum=0;
  for(var i=0;i<w.length;i++) sum+=weightOf(w[i]);
  return sum;
}
/* один проход по колоде вместо пересчёта на каждое сравнение при сортировке:
   w — сколько тяжести тянет знак, n — в скольких словах колоды он стоит */
function kanjiLoads(){
  var w={}, n={};
  for(var i=0;i<S.cards.length;i++){
    var c=S.cards[i], v=weightOf(c), seen={}, kj=mainText(c).match(KRE)||[];
    for(var k=0;k<kj.length;k++){
      if(seen[kj[k]]) continue; seen[kj[k]]=1;
      w[kj[k]]=(w[kj[k]]||0)+v; n[kj[k]]=(n[kj[k]]||0)+1;
    }
  }
  return { w:w, n:n };
}
/* Полоска знаков под словом: отсюда открывается разбор знака.
   Заполненные подчёркнуты — видно, что уже разобрано, а что нет. */
/* Подчёркивание «знак разобран» ставится при отрисовке, а окно знака живёт
   поверх списка и урока и их не перерисовывает. Поэтому правим отметку на месте:
   человек закрыл окно — и сразу видно, что знак теперь разобран. */
/* Знаки внутри слова в строке списка. Экранируем сначала, оборачиваем потом:
   подстановка трогает только иероглифы, а они внутри &amp;-последовательностей не встречаются. */
function kanjiSpans(txt){
  return esc(txt).replace(KRE,function(ch){
    return '<span class="kjt'+(hasKanji(ch)?" filled":"")+'" data-kanji="'+ch+'">'+ch+'</span>';
  });
}
function markKanji(ch){
  var on=hasKanji(ch), els=document.querySelectorAll('[data-kanji="'+ch+'"]');
  for(var i=0;i<els.length;i++) els[i].classList.toggle("filled",on);
}
function kanjiRow(word){
  var kj=String(word||"").match(KRE)||[], seen={}, out=[];
  for(var i=0;i<kj.length;i++){
    if(seen[kj[i]]) continue; seen[kj[i]]=1;
    out.push('<button class="kj'+(hasKanji(kj[i])?" filled":"")+'" data-kanji="'+esc(kj[i])+
      '" lang="ja" title="разобрать знак">'+esc(kj[i])+'</button>');
  }
  if(!out.length) return "";
  return '<div class="kjrow"><span class="kjlab">знаки</span>'+out.join("")+'</div>';
}

/* ---------- экран знаков ----------
   Справочник и рабочий список: все знаки колоды разом, от самых мешающих.
   Отсюда видно и что сделано, и за что браться дальше. */
function kanjiMatch(ch,q){
  if(!q) return true;
  if(ch===q) return true;
  if((q.match(KRE)||[]).indexOf(ch)>=0) return true;   /* вставили целое слово — найдём его знаки */
  var d=kanjiOf(ch);
  return ((d.m||"")+" "+(d.y||"")+" "+(d.r||"")+" "+(d.n||"")+" "+(d.e||"")+" "+(d.s||"")+" "+(d.w||""))
    .toLowerCase().indexOf(q)>=0;
}
function renderKanjiSheet(){
  var L=S.kview.L||(S.kview.L=kanjiLoads()), all=Object.keys(L.w);
  var done=0, i;
  for(i=0;i<all.length;i++) if(hasKanji(all[i])) done++;
  var q=(S.kview.q||"").trim().toLowerCase();
  var list=all.filter(function(ch){
    if(S.kview.f==="todo"&&hasKanji(ch)) return false;
    if(S.kview.f==="done"&&!hasKanji(ch)) return false;
    return kanjiMatch(ch,q);
  });
  list.sort(function(a,b){ return (L.w[b]||0)-(L.w[a]||0); });
  var show=list;              // показываем все знаки колоды, без урезания
  var html=show.map(function(ch){
    var d=kanjiOf(ch), n=L.n[ch]||0;
    return '<button class="ktile'+(d.m?" filled":"")+'" data-kanji="'+esc(ch)+'">'+
      '<span class="c" lang="ja">'+esc(ch)+'</span>'+
      '<span class="w">'+Math.round(L.w[ch]||0)+'</span>'+
      '<span class="m">'+(d.m?esc(d.m):скл(n,"слово","слова","слов"))+'</span></button>';
  }).join("");
  if(!show.length) html='<p class="kempty">'+(q?"По этому запросу знаков нет.":"Здесь пусто.")+'</p>';
  var g=$("#kGrid"), sc=g.scrollTop;
  g.innerHTML=html; g.scrollTop=sc;
  $("#kStat").textContent="знаков "+all.length+" · разобрано "+done+
    (list.length!==all.length?" · показано "+list.length:"");
}

function kanjiPool(all,withDone){

  for(var i=0;i<src.length;i++){
    var kj=mainText(src[i]).match(KRE)||[];
    for(var k=0;k<kj.length;k++){ if(seen[kj[k]]) continue; seen[kj[k]]=1; out.push(kj[k]); }

  if(!withDone) out=out.filter(function(ch){ return !hasKanji(ch); });
  var L=kanjiLoads().w;
  out.sort(function(a,b){ return (L[b]||0)-(L[a]||0); });
  return out;
}

      '<button class="btn ghost" id="kPrompt">Копировать промпт</button></div>'+
    '<p class="note" style="margin-top:10px">Ответ нейросети перетащите обратно в приложение — '+
      'разборы знаков разойдутся по знакам сами. Знак открывается нажатием на него '+
      'в раскрытой карточке или в уроке.</p>'+
    '<div class="chunk"><textarea id="kPromptBox" readonly>'+esc(KPROMPT)+'</textarea></div>');
  var pool=function(){ return kanjiPool($("#kAll").checked,$("#kDone").checked); };
  var take=function(){ var n=+$("#kN").value, p=pool(); return n?p.slice(0,n):p; };
  var info=function(){

  };
  ["kAll","kDone","kN"].forEach(function(id){ $("#"+id).addEventListener("change",info); });
  if(allDeck) $("#kAll").checked=true;          /* с экрана знаков считаем по всей колоде */
  info();
  $("#kJson").onclick=function(){
    var list=take(); if(!list.length){ toast("Нечего выгружать — всё уже разобрано"); return; }
    download("kanji_task_"+list.length+".json",JSON.stringify(kanjiTaskRows(list),null,1),"application/json");
    toast("Выгружено знаков: "+list.length);
  };
  $("#kCsv").onclick=function(){
    var list=take(); if(!list.length){ toast("Нечего выгружать — всё уже разобрано"); return; }
    var rows=kanjiTaskRows(list);
    var cols=["rank","kanji","words_in_deck","in_deck","again_total","meaning","readings","radicals","etymology","story","mnemonic","writing"];
    var lines=[cols.join(",")];
    rows.forEach(function(r){ lines.push(cols.map(function(k){ return csvCell(r[k]); }).join(",")); });
    download("kanji_task_"+rows.length+".csv",lines.join("\n"));

/* ответ нейросети про знаки: раскладываем по знакам, чужого не трогаем */
function mergeKanji(rows,cols){
  var cK=pick(cols,["kanji","знак","иероглиф"]);
  if(!cK) return { ok:0, miss:0 };
  var map={ m:["meaning","значение"], y:["readings","чтения","reading"],
            r:["radicals","радикалы","радикал"], e:["etymology","этимология"],
            s:["story","история","интересное"], n:["mnemonic","мнемоника"],
            w:["writing","strokes","как_писать","порядок_черт"] };
  var col={}; Object.keys(map).forEach(function(k){ col[k]=pick(cols,map[k]); });
  var ok=0, miss=0;
  rows.forEach(function(r){
    var raw=String(r[cK]==null?"":r[cK]).trim(), m=raw.match(KRE);
    if(!m||!m.length){ miss++; return; }
    var ch=m[0], o=S.kanji[ch]||{}, got=false;
    Object.keys(map).forEach(function(k){
      if(!col[k]) return;
      var v=String(r[col[k]]==null?"":r[col[k]]).trim();
      if(v){ o[k]=v; got=true; }
    });
    if(got){ S.kanji[ch]=o; touch(ch,"kanji"); ok++; } else miss++;
  });
  return { ok:ok, miss:miss };
}

/* ---------- выборка ---------- */
var FILTERS={
  tierA:function(c){ return c.a>=TIER.A; },
  tierB:function(c){ return c.a>=TIER.B&&c.a<TIER.A; },
  tierC:function(c){ return c.a>=TIER.C&&c.a<TIER.B; },
  tierD:function(c){ return c.a<TIER.C; },
  noetym:function(c){ return !etymOf(c); },
  todo:function(c){ return S.status[c.id]!=="done"; },
  due:function(c){ return isDue(c.id); },
  slow:function(c){ var m=S._med||{};
    return c.n>=5 && m.t>0 && (c.t||0)>=m.t*1.5 && (c.n?c.a/c.n:0)<=(m.rate||0); }
};
var EXCL={ tierA:["tierB","tierC","tierD"], tierB:["tierA","tierC","tierD"], tierC:["tierA","tierB","tierD"], tierD:["tierA","tierB","tierC"] };
function visible(){
  var q=S.q.toLowerCase(), act=Object.keys(S.filters);
  var res=S.cards.filter(function(c){
    for(var i=0;i<act.length;i++) if(!FILTERS[act[i]](c)) return false;
    if(q){
      if((c._s||"").indexOf(q)>=0) return true;
      if((S.notes[c.id]||"").toLowerCase().indexOf(q)>=0) return true;
      if(etymOf(c).toLowerCase().indexOf(q)>=0||storyOf(c).toLowerCase().indexOf(q)>=0) return true;
      return false;
    }
    return true;
  });
  if(S.sort==="word"){ res.sort(function(a,b){ return mainText(a).localeCompare(mainText(b),"ja"); }); return res; }
  /* проработанные сверху, свежеотмеченные раньше — видно, докуда дошёл */
  if(S.sort==="done"){
    res.sort(function(a,b){
      var da=S.status[a.id]==="done"?1:0, db=S.status[b.id]==="done"?1:0;
      if(da!==db) return db-da;
      if(da) return doneAt(b.id)-doneAt(a.id);
      return b.a-a.a;
    });
    return res;
  }
  var key={ again:function(c){return c.a}, score:score, rate:function(c){return c.rate},
            reviews:function(c){return c.n}, time:function(c){return c.t} }[S.sort];
  res.sort(function(a,b){ var x=key(a),y=key(b); if(x===y) return b.a-a.a; return x<y?1:-1; });
  return res;
}

/* ---------- рендер ---------- */
function fmtTime(ms){ return ms?(ms/1000).toFixed(1).replace(".",",")+" с":"—"; }

function simFold(c){

function textFields(c){

function cardFields(c){

    else html='<div class="f"><label>'+esc(lab)+'</label><textarea rows="'+(v.length>60?3:1)+'" data-k="'+esc(f.key)+
      '" data-i="'+idx+'"'+(ch?' class="changed"':"")+'>'+esc(v)+'</textarea></div>';
    var isServ=(f.label==="число"||f.label==="частотность"||f.label==="акцент")||(f.label===""&&v.length<=12);
    (isServ?serv:main).push(html);
  });
  return main.join("")+(serv.length?'<div class="fgrid">'+serv.join("")+'</div>':"");

/* всё редактирование — под одной крышкой: на виду остаётся разбор,

/* пустой экран: без карточек «ничего не подошло» звучит как поломка,
   хотя на деле не хватает только выгрузки статистики */
function emptyHTML(){

    '</p>';
}

  $("#list").innerHTML=html||emptyHTML();
