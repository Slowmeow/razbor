/* ---------- чтение по одной ---------- */
function startDrill(list,i){
  if(!list.length){ toast("Список пуст"); return; }
  S.drill={list:list,i:i||0}; $("#drill").hidden=false; document.body.style.overflow="hidden"; renderDrill();
}
function exitDrill(){ S.drill=null; $("#drill").hidden=true; document.body.style.overflow=""; renderAll(); }
/* Обратная сторона. В Anki слово всегда узнаёшь и никогда не производишь —
   поэтому оно «знакомое», но не своё. Раз в три повтора спрашиваем наоборот:
   показываем разбор и просим вспомнить само слово. Чередование считается от
   числа повторов, а не случайно, — иначе при перерисовке карточка бы прыгала. */
function canAskBack(c){
  return !!(etymOf(c)||storyOf(c)||dictOf(c,"en")||exampleText(c));
}
function isBack(c){
  if(!S.back||!canAskBack(c)) return false;
  var st=S.srs[c.id];
  return !!st && st.r>0 && st.r%3===2;
}
/* Само слово в примере закрываем — иначе подсказка выдаёт ответ. */
function maskWord(text,word){
  if(!text||!word) return text;
  return text.split(word).join("◻◻◻");
}
function backHint(c){
  var et=etymOf(c), st=storyOf(c), en=dictOf(c,"en"), ex=exampleText(c), w=mainText(c);
  var h="";
  if(et) h+=foldHTML("разбор и происхождение",prose(maskWord(et,w)),"prose",true);
  if(st) h+=foldHTML("интересное",prose(maskWord(st,w)),"prose",!et);
  if(!et&&!st&&en) h+=foldHTML("перевод (JP→EN)",'<span lang="ja">'+esc(maskWord(en,w))+'</span>',"",true);
  if(ex) h+='<div class="drillSent" lang="ja">'+esc(maskWord(ex,w))+'</div>';
  return h;
}
function скл(n,од,дв,мн){
  var a=Math.abs(n)%100, b=a%10;
  var сл=(a>10&&a<20)?мн:(b===1?од:(b>=2&&b<=4?дв:мн));
  return n+" "+сл;
}
function afterText(days){
  if(days<=0) return "сегодня";
  if(days===1) return "завтра";
  if(days<5) return "через "+days+" дня";
  if(days<31) return "через "+days+" дней";
  var m=Math.round(days/30); return "через "+m+" мес.";
}
/* Что будет с расписанием при каждой из кнопок — видно заранее,
   как в старом Anki: человек выбирает осознанно, а не наугад.
   Считаем начисто, ничего не трогая: это надпись, а не действие. */
/* Куда карточка поедет после ответа. Ничего не меняет — только считает,
   поэтому годится и для подписей на кнопках, и для самого ответа.
   Возвращает { st, mins }: mins больше нуля — карточка ещё на шагах обучения
   и вернётся в этом же уроке, ноль — уехала на дни. */
function nextState(st,g){
  var s=st?JSON.parse(JSON.stringify(st)):{ q:"learn", s:0, i:0, e:ANKI.ease0, r:0, l:0, d:today() };
  if(!s.q) s.q="learn";                       // на всякий случай: состояние из старой версии
  s.r=(s.r||0)+1;
  s.e=s.e||ANKI.ease0;
  if(s.q==="learn"||s.q==="relearn"){
    var st2=s.q==="learn"?ANKI.steps:ANKI.relearn;
    if(g===0){ s.s=0; s.d=today(); return { st:s, mins:st2[0] }; }
    if(g===1){
      /* «с трудом» на шагах повторяет шаг; на первом — среднее первого и второго */
      var m=(s.s===0&&st2.length>1)?(st2[0]+st2[1])/2:st2[Math.min(s.s,st2.length-1)];
      s.d=today(); return { st:s, mins:m };
    }
    s.s=(s.s||0)+1;
    if(s.s<st2.length){ s.d=today(); return { st:s, mins:st2[s.s] }; }
    /* шаги кончились — выпуск */
    s.i=s.q==="relearn" ? Math.max(ANKI.lapseMin,Math.round((s.i||0)*ANKI.lapse)) : ANKI.grad;
    s.q="review"; s.s=0; s.d=today()+s.i*DAY;
    return { st:s, mins:0 };
  }
  /* карточка на повторе */
  if(g===0){
    s.l=(s.l||0)+1;
    s.e=Math.max(ANKI.easeMin,s.e-0.2);
    s.q="relearn"; s.s=0; s.d=today();
    return { st:s, mins:ANKI.relearn[0] };
  }
  var поздно=Math.max(0,Math.round((today()-(s.d||today()))/DAY));   // насколько просрочено
  if(g===1){
    s.e=Math.max(ANKI.easeMin,s.e-0.15);
    s.i=Math.max((s.i||0)+1,Math.round((s.i||1)*ANKI.hard*ANKI.mod));
  }else{
    s.i=Math.max((s.i||0)+1,Math.round(((s.i||1)+поздно/2)*s.e*ANKI.mod));
  }
  s.i=Math.min(ANKI.max,s.i); s.d=today()+s.i*DAY;
  return { st:s, mins:0 };
}
/* Минуты шага — в честную подпись: карточка правда вернётся в этом уроке. */
function stepText(mins){
  return mins<=2 ? "ещё раз сейчас" : mins<8 ? "ещё раз скоро" : "ещё раз в конце урока";
}
/* Через сколько карточек вернуть её в урок: минута — почти сразу, десять — подальше. */
function stepGap(mins){ return Math.max(2,Math.min(12,Math.round(mins))); }
function gradePreview(id){
  var st=S.srs[id]||null;
  return [0,1,2].map(function(g){
    var n=nextState(st,g);
    return n.mins>0 ? stepText(n.mins) : afterText(n.st.i);
  });
}
/* ---------- откат ответа ----------

   Как в Anki: ответ можно отмотать, и отматывается всё, что он сдвинул, —
   расписание карточки, запись в дневнике, отметка «проработано», место
   в уроке и итоги занятия. Иначе откат врал бы: карточка вернулась,
   а снятый вес остался бы записан. */
function srsSnapshot(d,c){
  var k=logKey(), copy=function(o){ return o?JSON.parse(JSON.stringify(o)):null; };
  return {
    id:c.id, i:d.i, shown:d.shown, done:d.done,
    list:d.list.slice(), итог:copy(d.итог),
    srs:copy(S.srs[c.id]), status:S.status[c.id]===undefined?null:S.status[c.id],
    mtSrs:(S.mtimes.srs||{})[c.id], mtStatus:(S.mtimes.status||{})[c.id],
    logKey:k, log:copy(S.log[k]), mtLog:(S.mtimes.log||{})[k]
  };
}
function putMt(key,id,v){
  if(!S.mtimes[key]) S.mtimes[key]={};
  if(v===undefined) delete S.mtimes[key][id]; else S.mtimes[key][id]=v;
}
function canUndo(){ return !!(S.drill&&S.drill.undo&&S.drill.undo.length); }
function undoGrade(){
  if(!canUndo()){ toast("Отматывать нечего"); return; }
  var d=S.drill, u=d.undo.pop();
  d.i=u.i; d.shown=u.shown; d.done=u.done; d.list=u.list; d.итог=u.итог;
  if(u.srs) S.srs[u.id]=u.srs; else delete S.srs[u.id];
  if(u.status===null) delete S.status[u.id]; else S.status[u.id]=u.status;
  if(u.log) S.log[u.logKey]=u.log; else delete S.log[u.logKey];
  putMt("srs",u.id,u.mtSrs); putMt("status",u.id,u.mtStatus); putMt("log",u.logKey,u.mtLog);
  S.sync.dirty=true;
  saveSoon(); renderDrill(); $("#drillBody").scrollTop=0;
  var c=S._byId[u.id];
  toast("Отменено: "+(c?mainText(c):"ответ"),1600);
}

function renderDrill(){
  var d=S.drill; if(!d) return;
  if(d.i<0) d.i=0; if(d.i>=d.list.length) d.i=d.list.length-1;
  var c=d.list[d.i], read=byLabel(c,"чтение"), ex=exampleText(c), et=etymOf(c), st=storyOf(c);
  var learn=d.mode==="learn", hide=learn&&!d.shown, back=learn&&isBack(c);
  /* ближе к концу считаем не пройденное, а остаток: к цели идут быстрее,
     когда видно, сколько до неё */
  var осталось=d.list.length-d.i;
  $("#drillPos").textContent=(learn&&d.i>=Math.floor(d.list.length/2)&&осталось>1)
    ? "осталось "+осталось
    : (learn?"урок "+(d.lesson||"повтор")+" · ":"")+(d.i+1)+" / "+d.list.length;
  $("#drillFill").style.width=((d.i+1)/d.list.length*100)+"%";
  $("#drillUndo").hidden=!(learn&&canUndo());
  $("#drillRead").hidden=learn; $("#drillLearn").hidden=!learn;
  if(learn){
    $("#drillShow").textContent=back?"Показать слово":"Показать разбор";
    $("#drillShow").hidden=d.shown;

      $("#gs0").textContent=pr[0]; $("#gs1").textContent=pr[1]; $("#gs2").textContent=pr[2]; }
  }
  $("#drillBody").innerHTML=
    (back&&hide?'<p class="backTag">по разбору — вспомните слово</p>'+backHint(c):
      '<div class="drillHead"><div class="drillWord" lang="ja">'+esc(mainText(c))+'</div>'+
        (hide?"":sayBtn(mainText(c)))+'</div>')+
    (read&&!hide?'<div class="drillRead" lang="ja">'+esc(read)+'</div>':"")+
    (hide&&!back?'<p class="note" style="margin-top:14px">Вспомните чтение и значение, потом откройте разбор.</p>':"")+
    (ex&&!hide?'<div class="drillSent" lang="ja">'+esc(ex)+'</div>':"")+
    (hide?"":kanjiRow(mainText(c)))+
    (hide?"":'<div class="drillStats"><span>важность '+tierOf(c)+'</span><span>'+c.a+' Again из '+c.n+'</span>'+
      '<span>'+fmtTime(c.t)+'</span>'+(learn&&S.srs[c.id]?'<span>повторов '+(S.srs[c.id].r||0)+'</span>':"")+'</div>')+
    (hide?"":
      (et?foldHTML("разбор и происхождение",prose(et),"prose",learn):"")+
      (st?foldHTML("интересное",prose(st),"prose",learn):"")+
      (!et&&!st?'<p class="note" style="margin-top:16px">Разбора пока нет — напишите свою зацепку ниже. '+
        'Или соберите готовые: ⋯ → Задание для нейросети.</p>':"")+

function drillMove(step){
  var d=S.drill; if(!d) return;

var LP={ t:null, x:0, y:0, fired:false };

$("#list").addEventListener("pointerdown",function(e){
  LP.fired=false; lpCancel();
  var t=e.target.closest(".row [data-kanji]"); if(!t) return;
  LP.x=e.clientX; LP.y=e.clientY;
  LP.t=setTimeout(function(){
    LP.t=null; LP.fired=true;

    openKanji(t.dataset.kanji);
  },420);
});

  if(LP.t&&(Math.abs(e.clientX-LP.x)>10||Math.abs(e.clientY-LP.y)>10)) lpCancel();

});
$("#list").addEventListener("click",function(e){
  if(LP.fired){ LP.fired=false; return; }   /* разбор знака уже открыт — карточку не трогаем */
  /* в раскрытой карточке знаки нажимаются обычным тапом, в строке — только долгим */
  var kj=e.target.closest("[data-kanji]"); if(kj&&!kj.closest(".row")){ openKanji(kj.dataset.kanji); return; }
  var go=e.target.closest("[data-go]"); if(go){ jumpTo(go.dataset.go); return; }
  if(e.target.closest(".editor")){
    var btn=e.target.closest("[data-act]"); if(!btn) return;
    var cid=btn.closest(".editor").dataset.ed;
    var card=S.cards.filter(function(x){ return x.id===cid; })[0], act=btn.dataset.act;
    if(act==="done"){ if(S.status[cid]==="done") delete S.status[cid]; else { S.status[cid]="done"; scheduleIfNew(cid); } touch(cid,"status");
      saveSoon(); renderHead(); renderChips(); renderList(); }
    if(act==="revert"){ delete S.edits[card.note]; saveSoon(); renderList(); toast("Текст возвращён"); }
    if(act==="drill"){ var pos=0; S._vis.forEach(function(x,i){ if(x.id===cid) pos=i; }); startDrill(S._vis,pos); }
    if(act==="close"){ S.open=null; renderList(); }
    return;
  }
  var row=e.target.closest(".row"); if(!row) return;
  var c=S._vis[+row.dataset.i]; S.cursor=+row.dataset.i;
  S.open=(S.open===c.id)?null:c.id; renderList();

function jumpTo(id){
  S.open=id; S.q=""; $("#q").value="";
  var pos=-1; S._vis.forEach(function(c,i){ if(c.id===id) pos=i; });
  if(pos<0){ S.filters={}; renderChips(); renderList(); S._vis.forEach(function(c,i){ if(c.id===id) pos=i; }); }
  if(pos>=0){ S.page=Math.floor(pos/S.PAGE); S.cursor=pos; }
  renderList();

function onEdit(e){
  var host=e.target.closest(".editor");
  var card=host?S.cards.filter(function(x){ return x.id===host.dataset.ed; })[0]:(S.drill?S.drill.list[S.drill.i]:null);
  if(!card) return;
  var t=e.target;
  if(t.dataset.etym){ var v=t.value.trim(); if(v) S.etym[card.id]=v; else delete S.etym[card.id]; touch(card.id,"etym"); saveSoon(); return; }
  if(t.dataset.story){ var w=t.value.trim(); if(w) S.story[card.id]=w; else delete S.story[card.id]; touch(card.id,"story"); saveSoon(); return; }
  if(t.dataset.note){ var nv=t.value.trim(); if(nv) S.notes[card.id]=t.value; else delete S.notes[card.id]; touch(card.id,"notes"); saveSoon(); return; }
  if(t.dataset.diff){ setDiff(card.id,t.dataset.diff,t.value); t.classList.toggle("filled",!!t.value.trim()); return; }
  var ta=t.closest("textarea[data-k]"); if(!ta) return;
  var f=card.f[+ta.dataset.i];
  setEdit(card,f.key,ta.value,f.v);
  reindexCard(card);
  ta.classList.toggle("changed",ta.value!==f.v);
}

$("#drillGrades").addEventListener("click",function(e){
  var b=e.target.closest("[data-g]"); if(!b||!S.drill) return;
  var d=S.drill, c=d.list[d.i], g=+b.dataset.g;
  var былВ=!!S.srs[c.id], держал=былВ&&(S.srs[c.id].i||0)>=7&&isDue(c.id)&&g>0;
  if(!d.итог) d.итог={ w:0, a:0, держит:0, взято:0 };
  /* снимок ДО любых изменений — с него откатывается всё разом */
  if(!d.undo) d.undo=[];
  d.undo.push(srsSnapshot(d,c));
  if(d.undo.length>200) d.undo.shift();
  if(g>0){ d.итог.w+=gainOf(c,g,былВ); d.итог.взято++;
    if(tierOf(c)==="A") d.итог.a++; if(держал) d.итог.держит++; }
  var n=grade(c.id,g);
  ding(g===0?"miss":"ok");
  saveSoon();
  /* карточка ещё на шагах обучения — вернётся в этом же уроке, как в Anki */
  if(n.mins>0&&d.list.length<200) d.list.splice(Math.min(d.list.length,d.i+1+stepGap(n.mins)),0,c);
  else d.done++;
  d.shown=false;
  if(d.i+1>=d.list.length) return finishLesson();
  d.i++; renderDrill(); $("#drillBody").scrollTop=0;
  toast(mainText(c)+" — "+(n.mins>0?stepText(n.mins):afterText(n.st.i)),1400);
});
function finishLesson(){
  var d=S.drill, num=d.lesson, it=d.итог||{ w:0, a:0, держит:0, взято:0 };
  ding("done");
  if(num) logAdd({ l:1 });
  exitDrill();
  var again=0, list=num?S.cards.filter(function(c){ return S.lesson[c.id]===num; }):[];
  list.forEach(function(c){ if(!S.srs[c.id]||isDue(c.id)) again++; });
  /* говорим, что сдвинулось, а не сколько начислено: число рядом и мелким */
  var фраза=it.a
    ? скл(it.a,"слово","слова","слов")+" из A "+(it.a===1?"ушло":"ушли")+" на повтор"
    : (it.взято?скл(it.взято,"карточка","карточки","карточек")+" "+(it.взято===1?"ушла":"ушли")+" на повтор"
                :"Пока ничего не закрыто — карточки вернутся сегодня же");
  openModal(num?"Урок "+num+" пройден":"Повтор пройден",
    num?(again?"Осталось на потом: "+again:"Урок закрыт целиком"):"",
    '<p class="bigline">'+esc(фраза)+'</p>'+
    (it.держит?'<p class="note">Память держит: '+it.держит+' — эти вернулись через неделю и дольше, и вы их вспомнили.</p>':"")+
    '<p class="note">Снято веса: '+it.w+(streak()>1?" · подряд дней: "+streak():"")+'</p>'+
    '<p class="note" style="margin-top:8px">'+(num&&!again
      ? "Все карточки урока уехали на повтор — вернутся сами, когда придёт срок."
      : "Карточки вернутся по расписанию: не помню — сегодня же, с трудом — скоро, помню — позже.")+'</p>'+
    '<div class="acts"><button class="btn primary" id="planAgain">К урокам</button>'+
      (d.undo&&d.undo.length?'<button class="btn" id="planUndo">↶ Отменить ответ</button>':"")+
      '<button class="btn ghost" id="planClose">Закрыть</button></div>');

  if(sh){ sh.classList.add("calm"); setTimeout(function(){ sh.classList.remove("calm"); },400); }
  $("#planAgain").onclick=openPlan;
  $("#planClose").onclick=closeModal;

     снимок сделан до записи «урок пройден», поэтому она откатится вместе с ним */
  if($("#planUndo")) $("#planUndo").onclick=function(){
    closeModal(); S.drill=d;
    $("#drill").hidden=false; document.body.style.overflow="hidden";
    undoGrade();
  };
}

/* ---------- синхронизация между устройствами (секретный gist на GitHub) ---------- */
var SYNCFILE="anki-dashboard.json";          // ваши тексты
var CARDPREFIX="anki-dashboard-cards";       // колода: -01.json, -02.json, …
                                             // без неё на новом устройстве тексты некуда положить
/* передаём поля ровно в том виде, в каком они лежат в базе: 700 — предел
   для длинных полей при разборе csv, 900 — для словарной статьи в хранилище */
var CARD_FIELD_MAX=PREVIEW_MAX, DICT_SYNC_MAX=STORE_DICT_MAX, PART_MAX=700*1024, PARTS_MAX=40;

/* Колода лежит в отдельном гисте и уезжает только когда правда менялась.
   Иначе каждая правка разбора тащила бы по сети всю колоду со словарями. */
function deckAt(){ return S.cardsAt||0; }
function deckSig(){
  if(!S.cards.length) return "";
  return [deckAt(), S.cards.length, S.sync.dicts!==false?"d":"n"].join("/");
}
function deckInfo(){ return S.sync.deck||{ gist:"", sig:"", at:0, n:0, parts:0 }; }
function syncPayload(){
  return { v:9, at:Date.now(), edits:S.edits, status:S.status, notes:S.notes,
           etym:S.etym, story:S.story, sent:S.sent, lastTask:S.lastTask,
           srs:S.srs, lesson:S.lesson, diff:S.diff, log:S.log, kanji:S.kanji, size:S.size||20,
           mtime:S.mtime, mtimes:S.mtimes, deck:deckInfo() };
}
function partName(n){ return CARDPREFIX+"-"+("0"+n).slice(-2)+".json"; }
function cardOne(c,dicts,lean){
  var f=[];
  for(var i=0;i<c.f.length;i++){
    var x=c.f[i];
    if(x.dict){
      if(!dicts) continue;
      f.push({ key:x.key, label:x.label, ed:false, dict:true, v:String(x.v||"").slice(0,DICT_SYNC_MAX) });
      continue;
    }
    if(lean&&f.length>=3&&i>0) continue;   // первое поле — само слово, его берём всегда
    f.push({ key:x.key, label:x.label, ed:!!x.ed, v:String(x.v||"").slice(0,CARD_FIELD_MAX) });
  }
  return { id:c.id, note:c.note, deck:c.deck, n:c.n, a:c.a, rate:c.rate, t:c.t,
           last:c.last, first:c.first, ivl:c.ivl, added:c.added, f:f };
}
/* Колода режется на куски: в один файл гиста всю её класть незачем,
   а кусками влезает колода любого размера. */
function cardParts(dicts,lean){
  var at=S.cardsAt||Date.now(), groups=[], cur=[], size=0;
  for(var i=0;i<S.cards.length;i++){
    var o=cardOne(S.cards[i],dicts,lean), s=JSON.stringify(o).length+1;
    if(cur.length&&size+s>PART_MAX){ groups.push(cur); cur=[]; size=0; }
    cur.push(o); size+=s;
  }
  if(cur.length) groups.push(cur);
  return groups.map(function(part,i){
    return JSON.stringify({ v:2, at:at, part:i+1, parts:groups.length, n:part.length,
                            deck:S.deck||null, imports:S.imports.slice(0,5), cards:part });
  });
}
/* прикидка веса по первой сотне — чтобы показать её в окне, не собирая всё целиком */
function deckWeight(dicts){
  var n=Math.min(S.cards.length,100), sum=0;
  for(var i=0;i<n;i++) sum+=JSON.stringify(cardOne(S.cards[i],dicts,false)).length;
  if(!n) return 0;
  return Math.round(sum/n*S.cards.length);
}
function weightText(b){
  return b>=1048576 ? (b/1048576).toFixed(1).replace(".",",")+" МБ" : Math.round(b/1024)+" КБ";
}

/* Отметки времени. lastLocal/lastRemote — точное время правки этого поля,
   undefined значит «здесь его вообще не трогали». Общий mtime по карточке —
   для старых версий, где времени по полям ещё не было. */
function lastLocal(key,id){ var m=S.mtimes[key]; return m&&m[id]!=null?m[id]:undefined; }
function lastRemote(r,key,id){ var m=r.mtimes&&r.mtimes[key]; return m&&m[id]!=null?m[id]:undefined; }
function localTime(key,id){ var e=lastLocal(key,id); return e===undefined?(S.mtime[id]||0):e; }
function remoteTime(r,key,id){ var e=lastRemote(r,key,id); return e===undefined?((r.mtime&&r.mtime[id])||0):e; }

function mergeTexts(r){
  var added=0, updated=0, removed=0;
  /* srs и lesson — не строки, а объекты и числа: сравниваем их как есть */
  ["etym","story","notes","status","sent","srs","lesson","diff","log","kanji"].forEach(function(key){
    var rm=r[key]||{}, mine=S[key]||(S[key]={});
    var same=function(a,b){ return typeof a==="object"||typeof b==="object"
      ? JSON.stringify(a)===JSON.stringify(b) : a===b; };
    Object.keys(rm).forEach(function(id){
      var rv=rm[id]; if(rv==null||rv==="") return;
      var lv=mine[id];
      if(lv==null||lv===""){
        var lx=lastLocal(key,id);
        /* пусто здесь и есть там: берём, если только мы это сами не стёрли позже */
        if(lx===undefined||remoteTime(r,key,id)>=lx){ mine[id]=rv; added++; }
        return;
      }
      if(!same(lv,rv)&&remoteTime(r,key,id)>localTime(key,id)){ mine[id]=rv; updated++; }
    });
    /* стёрли на другом устройстве — стираем и здесь. Только по точному времени поля,
       иначе старая версия без mtimes снесла бы всё подряд. */
    Object.keys(mine).forEach(function(id){
      if(rm[id]!=null&&rm[id]!=="") return;
      var rx=lastRemote(r,key,id); if(rx===undefined) return;
      if(rx>localTime(key,id)){ delete mine[id]; removed++; }
    });
  });
  var re=r.edits||{};
  Object.keys(re).forEach(function(nid){
    var lx=lastLocal("edits",nid), rt=remoteTime(r,"edits",nid);
    if(!S.edits[nid]){ if(lx===undefined||rt>=lx){ S.edits[nid]=re[nid]; added++; } return; }
    if(rt>localTime("edits",nid)){ S.edits[nid]=re[nid]; updated++; }
  });
  Object.keys(S.edits).forEach(function(nid){
    if(re[nid]) return;
    var rx=lastRemote(r,"edits",nid); if(rx===undefined) return;
    if(rx>localTime("edits",nid)){ delete S.edits[nid]; removed++; }
  });
  Object.keys(r.mtime||{}).forEach(function(id){ if((r.mtime[id]||0)>(S.mtime[id]||0)) S.mtime[id]=r.mtime[id]; });
  Object.keys(r.mtimes||{}).forEach(function(key){
    var rm=r.mtimes[key]||{}; if(!S.mtimes[key]) S.mtimes[key]={};
    Object.keys(rm).forEach(function(id){ if((rm[id]||0)>(S.mtimes[key][id]||0)) S.mtimes[key][id]=rm[id]; });
  });
  if(r.lastTask&&(!S.lastTask||r.lastTask.at>S.lastTask.at)) S.lastTask=r.lastTask;
  if(r.size>0&&(r.at||0)>(S.sizeAt||0)){ S.size=r.size; S.sizeAt=r.at||0; }
  /* второе устройство могло ещё не обновиться и прислать расписание в старой форме */
  removed+=dropOldSrs();
  return { added:added, updated:updated, removed:removed };
}
/* колода из хранилища: новых карточек добавляем всегда, цифры перебиваем только
   если тот экспорт свежее нашего — иначе свежая статистика откатится на старую */
function mergeRemoteCards(rc){
  var inc=(rc&&rc.cards)||[], added=0, updated=0;
  if(!inc.length) return { added:0, updated:0 };
  var idx={},i; for(i=0;i<S.cards.length;i++) idx[S.cards[i].id]=S.cards[i];
  var fresh=(rc.at||0)>(S.cardsAt||0);
  for(i=0;i<inc.length;i++){
    var nc=inc[i]; if(!nc||nc.id==null) continue;
    nc.id=String(nc.id); nc.note=String(nc.note==null?nc.id:nc.note); nc.f=nc.f||[];
    var e=idx[nc.id], touched=false;
    if(!e){ S.cards.push(nc); idx[nc.id]=nc; added++; continue; }
    if(fresh){
      if(e.n!==nc.n||e.a!==nc.a) touched=true;
      e.n=nc.n; e.a=nc.a; e.rate=nc.rate; e.t=nc.t; e.ivl=nc.ivl;
      e.last=nc.last||e.last; e.first=e.first||nc.first; e.deck=nc.deck||e.deck;
    }
    /* поля дописываем всегда, а не только при свежем экспорте: словари могли
       не попасть в прошлую отправку, и ждать нового csv ради них незачем */
    for(var j=0;j<nc.f.length;j++){
      var have=false;
      for(var k=0;k<e.f.length;k++) if(e.f[k].key===nc.f[j].key){ have=true; break; }
      if(!have){ e.f.push(nc.f[j]); touched=true; }
    }
    if(touched) updated++;
  }
  if(fresh){
    S.cardsAt=rc.at||Date.now();
    if(rc.deck&&!S.deck) S.deck=rc.deck;
    if(rc.imports&&rc.imports.length&&!S.imports.length) S.imports=rc.imports;
  }
  if(added||updated) buildIndex();
  return { added:added, updated:updated };
}

/* адрес хранилища люди вставляют как ссылку целиком — вытаскиваем из неё id */
function gistId(s){
  s=String(s||"").trim();
  if(!s) return "";
  s=s.replace(/^https?:\/\/[^\/]+\//i,"").replace(/[#?].*$/,"").replace(/\.git$/i,"").replace(/\/+$/,"");
  var parts=s.split("/");
  return (parts[parts.length-1]||"").trim();
}
async function gist(method,path,body){
  var res;
  try{
    res=await fetch("https://api.github.com"+path,{
      method:method,
      headers:{ "Authorization":"Bearer "+S.sync.token, "Accept":"application/vnd.github+json",
                "Content-Type":"application/json" },
      body: body?JSON.stringify(body):undefined });
  }catch(e){ var ne=new Error(online()?"нет связи с github.com":"нет сети — приложение работает офлайн, обмен подождёт");
    ne.status=0; throw ne; }
  if(!res.ok){
    var j=null; try{ j=await res.json(); }catch(x){}
    var why=res.status===401 ? " — токен не подошёл или отозван"
          : res.status===404 ? " — хранилище не найдено: проверьте адрес, а у токена — право gist"
          : res.status===403 ? " — github не пустил, возможно упёрлись в лимит запросов"
          : res.status===422 ? " — github не принял данные"+(j&&j.message?": "+j.message:"")
          : (j&&j.message?" — "+j.message:"");
    var err=new Error("GitHub ответил "+res.status+why); err.status=res.status; throw err;
  }
  return await res.json();
}
function counts(o){
  return { et:Object.keys(o.etym||{}).length, st:Object.keys(o.story||{}).length,
           nt:Object.keys(o.notes||{}).length, dn:Object.keys(o.status||{}).length,
           kj:Object.keys(o.kanji||{}).length };
}
/* тихий обмен всё-таки подаёт голос, когда что-то приехало:
   иначе непонятно, откуда на экране взялись чужие отметки */
function arrived(t,cards){
  if(!t||!(t.added||t.updated||t.removed||(cards&&cards.added))) return;
  toast("С другого устройства приехало: текстов новых "+t.added+
    (t.updated?", обновлено "+t.updated:"")+(t.removed?", убрано "+t.removed:"")+
    ((cards&&cards.added)?", карточек новых "+cards.added:""),4000);
}
function countsText(c){ return c.et+" разборов, "+c.st+" интересного, "+c.nt+" заметок, "+c.dn+" проработано"+
  (c.kj?", "+c.kj+" знаков":""); }
function stampNow(){ return new Date().toISOString().slice(0,16).replace("T"," "); }
async function remoteFile(g,name){
  var f=g.files&&g.files[name]; if(!f) return null;
  var text=f.content;
  if(f.truncated||text==null){
    var res; try{ res=await fetch(f.raw_url); }catch(e){ res=null; }
    if(!res||!res.ok) throw new Error("github не отдал "+name+" целиком");
    text=await res.text();
  }
  try{ return JSON.parse(text); }catch(e){ throw new Error("в хранилище испорченный "+name); }
}
/* колода лежит кусками — собираем её обратно; заодно понимаем старый одиночный файл */
async function remoteCards(g){
  var names=Object.keys(g.files||{}).filter(function(n){ return n.indexOf(CARDPREFIX)===0; }).sort();
  if(!names.length) return null;
  var head=null, cards=[];
  for(var i=0;i<names.length;i++){
    var j=await remoteFile(g,names[i]); if(!j) continue;
    if(!head||(j.at||0)>(head.at||0)) head=j;
    cards=cards.concat(j.cards||[]);
  }
  if(!head) return null;
  return { v:head.v, at:head.at, deck:head.deck, imports:head.imports, parts:names.length, cards:cards };
}
/* Тексты — маленькие, их тянем при каждом обмене.
   Колоду трогаем отдельно и только по надобности. */
async function remoteAll(){                 // null — хранилища нет
  if(!S.sync.gist) return null;
  var g=await gist("GET","/gists/"+S.sync.gist);
  var texts=await remoteFile(g,SYNCFILE);
  var here=Object.keys(g.files||{}).filter(function(n){ return n.indexOf(CARDPREFIX)===0; });
  return { texts:texts, names:Object.keys(g.files||{}), oldCardsHere:here,
           /* колода из старого хранилища, где она лежала рядом с текстами */
           legacy: here.length?await remoteCards(g):null };
}
async function remoteDeck(id){
  if(!id) return null;
  return await remoteCards(await gist("GET","/gists/"+id));
}
/* нужно ли вообще отправлять колоду: сравниваем с тем, что уже лежит */
function deckNeedsPush(rd){
  if(S.sync.cards===false||!S.cards.length) return false;
  if(!rd||!rd.gist) return true;                       // в хранилище колоды нет
  if(rd.sig===deckSig()) return false;                 // ровно то же самое
  if(deckAt()>(rd.at||0)) return true;                 // у нас свежее выгрузка статистики
  if(deckAt()<(rd.at||0)) return false;                // у них свежее — не трогаем
  /* тот же экспорт: досылаем, только если у нас есть словари, а там их нет */
  return S.sync.dicts!==false && String(rd.sig||"").slice(-1)!=="d";
}
function syncFail(what,e,quiet){
  console.warn("sync:",e);
  var cfg=(e.status===401||e.status===403||e.status===404||e.status===422);
  /* токен отозвали или хранилище удалили — сам обмен выключаем, иначе ошибка
     будет выскакивать при каждом открытии. Вернётся, когда настройки сохранят */
  if(cfg&&quiet){ S.sync.off=true; sset(K.sync,JSON.stringify(S.sync)); }
  if(!quiet||cfg) toast(what+": "+e.message+(cfg&&quiet?". Обмен сам собой приостановлен — загляните в настройки":""),7000);
}
/* один обмен за раз: автоотправка не должна влезать в середину «Забрать» */
var syncBusy=false, syncQueued=false, syncT=null;
function online(){ return navigator.onLine!==false; }
function syncSoon(){
  if(!(S.sync.auto&&S.sync.token&&S.sync.gist&&S.sync.ready)) return;
  if(!online()){ S.sync.pending=true; return; }          // вернётся сеть — отправим
  clearTimeout(syncT); syncT=setTimeout(function(){ syncPush(true); },5000);
}
/* Обмен без кнопки. Хранилище настроено — значит человек хочет одно и то же
   на всех устройствах, и незачем заставлять его лезть в меню:
   открыли — забрали свежее, ушли — отдали своё. */
function syncable(){ return !!(S.sync.token&&S.sync.gist&&online()&&!S.sync.off); }
async function syncOnOpen(){
  if(!syncable()) return;
  /* своё несохранённое отдаём отправкой: она сама сначала сольёт чужое */
  if(S.sync.dirty) await syncPush(true); else await syncPull(true);
}
function syncOnLeave(){ if(S.sync.dirty&&syncable()) syncPush(true); }

/* Отправка сначала забирает то, что уже лежит, и сливает с локальным.
   Без этого устройство, на котором ещё пусто, затирало работу с другого. */
async function syncPush(quiet){
  if(!S.sync.token){ if(!quiet) toast("Сначала укажите токен"); return; }
  if(syncBusy){ if(quiet) syncQueued=true; else toast("Уже синхронизирую, секунду"); return; }
  syncBusy=true;
  var sentDeck=0;
  try{
    var changed=null, oldHere=[];
    if(S.sync.gist){
      try{
        var r=await remoteAll();
        if(r&&r.texts){
          changed=mergeTexts(r.texts);
          /* чужой указатель на колоду принимаем, если своего нет или их свежее */
          var rd=r.texts.deck;
          if(rd&&rd.gist&&(!deckInfo().gist||(rd.at||0)>(deckInfo().at||0))) S.sync.deck=rd;
        }
        if(r) oldHere=r.oldCardsHere||[];
      }catch(e){
        if(e.status===404){ S.sync.gist=""; toast("Прежнее хранилище не нашлось, создаю новое",5000); }
        else{ syncFail("Не сверился с хранилищем, отправку отменил",e,quiet); return; }
      }
    }
    if(deckNeedsPush(deckInfo())){
      var parts=cardParts(S.sync.dicts!==false,false);
      if(parts.length>PARTS_MAX) parts=cardParts(false,false);       // без словарей
      if(parts.length>PARTS_MAX) parts=cardParts(false,true);        // и без длинных полей
      if(parts.length>PARTS_MAX){
        if(!quiet) toast("Колода великовата даже кусками — отправил только тексты",6000);
      }else{
        if(!quiet) toast("Отправляю колоду, это дольше обычного…",8000);
        var df={}, was=deckInfo().parts||0;
        parts.forEach(function(txt,i){ df[partName(i+1)]={ content:txt }; });
        for(var k=parts.length+1;k<=was;k++) df[partName(k)]=null;   // лишние куски убираем
        var dgist=deckInfo().gist, dg;
        if(dgist) await gist("PATCH","/gists/"+dgist,{files:df});
        else{
          dg=await gist("POST","/gists",{ description:"Разбор колоды — колода", public:false, files:df });
          dgist=dg.id;
        }
        S.sync.deck={ gist:dgist, sig:deckSig(), at:deckAt(), n:S.cards.length, parts:parts.length };
        sentDeck=parts.length;
      }
    }
    var files={}; files[SYNCFILE]={ content:JSON.stringify(syncPayload()) };
    S.sync.dirty=false;      // всё, что было на этот миг, уже в посылке
    /* переезд со старого хранилища: колода теперь живёт отдельно */
    oldHere.forEach(function(n){ files[n]=null; });
    if(S.sync.gist) await gist("PATCH","/gists/"+S.sync.gist,{files:files});
    else{
      var g=await gist("POST","/gists",{ description:"Разбор колоды — мои разборы", public:false, files:files });
      S.sync.gist=g.id;
    }
    S.sync.at=stampNow();
    S.sync.ready=true;
    await sset(K.sync,JSON.stringify(S.sync));
    await saveTexts();
    if(changed&&(changed.added||changed.updated||changed.removed)){ renderAll(); if(quiet) arrived(changed); }
    if(!quiet) toast("Отправлено: "+countsText(counts(syncPayload()))+
      (sentDeck?" и колода, "+S.cards.length+" карточек"+(S.sync.dicts!==false?" со словарями":"")
               :(S.cards.length?". Колода не менялась — не гонял её зря":"")),5000);
  }catch(e){ syncFail("Не отправилось",e,quiet); }
  finally{ syncBusy=false; if(syncQueued){ syncQueued=false; syncSoon(); } }
}
async function syncPull(quiet){
  if(!S.sync.token||!S.sync.gist){ if(!quiet) toast("Нужны токен и адрес хранилища"); return; }
  if(syncBusy){ if(!quiet) toast("Уже синхронизирую, секунду"); return; }
  syncBusy=true;
  try{
    var r=await remoteAll();
    if(!r||(!r.texts&&!r.legacy)){ if(!quiet) toast("Хранилище пустое — отправьте с того устройства, где есть тексты",5000); return; }
    var t=r.texts?mergeTexts(r.texts):{added:0,updated:0,removed:0};
    var rd=(r.texts&&r.texts.deck)||null, deck=r.legacy;
    /* колоду тянем, только если она там другая, чем у нас: обычно этого не случается,
       и обмен остаётся лёгким */
    if(!deck&&rd&&rd.gist&&(rd.sig!==deckInfo().sig||!S.cards.length)){
      if(!quiet) toast("Забираю колоду, это дольше обычного…",8000);
      deck=await remoteDeck(rd.gist);
    }
    var cm=deck?mergeRemoteCards(deck):{added:0,updated:0};
    if(rd&&rd.gist&&deck) S.sync.deck=rd;
    else if(rd&&rd.gist&&!deckInfo().gist) S.sync.deck=rd;
    S.sync.ready=true;
    await sset(K.sync,JSON.stringify(S.sync));
    if(cm.added||cm.updated) await saveAll(); else await saveTexts();
    renderAll();
    if(quiet) arrived(t,cm);
    if(!quiet){
      var m="Забрал: новых "+t.added+", обновлено "+t.updated+(t.removed?", убрано "+t.removed:"")+
             ". Теперь здесь: "+countsText(counts(syncPayload()));
      if(cm.added||cm.updated) m+="; карточек новых "+cm.added+(cm.updated?", обновлено "+cm.updated:"");
      else if(S.cards.length) m+=". Колода не менялась — не тянул её зря";
      if(!S.cards.length) m+=". Карточек нет ни здесь, ни в хранилище — киньте сюда card_summary.csv";
      toast(m,7000);
    }
  }catch(e){ syncFail("Не забралось",e,quiet); }
  finally{ syncBusy=false; }
}

function planLine(){
  var p=planCounts();
  if(!p.всего) return "";
  var part=[];
  if(p.новых) part.push(p.новых+" новых");
  if(p.кповтору) part.push(p.кповтору+" к повтору");
  if(!part.length) part.push("на сегодня всё");
  var s=streak();
  if(s>1) part.push(скл(s,"день","дня","дней")+" подряд");
  return part.join(" · ");
}
function renderPlanBtn(){
  var b=$("#lessonBtn"); if(!b) return;

  b.innerHTML='Заниматься'+(line?'<small>'+esc(line)+'</small>':"");

/* Таблица итогов. Это зеркало, а не счёт: цифра говорит, сколько тяжести снято
   с колоды, и её нельзя нафармить на лёгких карточках — вес берётся из той же
   формулы, по которой карточки разложены на уроки. */
function tallyHTML(){
  var days=lastDays(14), max=1, всего=0, карт=0;
  days.forEach(function(d){ if(d.w>max) max=d.w; всего+=d.w; карт+=d.n; });
  if(!totalWeight()) return "";
  var s=streak(), сегодня=days[days.length-1], рек=heaviestDone(), пр=paceForecast();
  var меток=["","",""];
  var bars=days.map(function(d,i){
    var h=Math.max(2,Math.round(d.w/max*100));
    var подпись=d.день.slice(8)+"."+d.день.slice(5,7);
    return '<div class="tbar'+(i===days.length-1?" now":"")+'" title="'+esc(подпись+" · "+d.n+" карточек · вес "+d.w)+'">'+
      '<i style="height:'+h+'%"></i><span>'+d.день.slice(8)+'</span></div>';
  }).join("");
  return '<div class="tally">'+
    '<div class="tallyLine">'+
      (s>1?'<b>'+скл(s,"день","дня","дней")+' подряд</b> · ':"")+
      'сегодня <b>'+(сегодня.w||0)+'</b> · за две недели <b>'+всего+'</b> · всего <b>'+totalWeight()+'</b>'+
    '</div>'+
    '<div class="tbars">'+bars+'</div>'+
    '<details class="fold"><summary>итоги подробнее</summary><div class="body">'+
      '<table class="tallyTab"><tr><th>день</th><th>уроков</th><th>карточек</th><th>вес</th><th>держит</th></tr>'+
      days.filter(function(d){ return d.n||d.l; }).reverse().map(function(d){
        return '<tr><td>'+esc(d.день.slice(8)+"."+d.день.slice(5,7))+'</td><td>'+d.l+'</td><td>'+d.n+'</td><td>'+d.w+'</td><td>'+(d.h||"—")+'</td></tr>';
      }).join("")+'</table>'+
      '<p class="note" style="margin-top:10px">В колонке «держит» — карточки, которые вернулись '+
        'через неделю и дольше, и вы их вспомнили. Это и есть доказательство, что память работает.</p>'+
      (рек?'<p class="note">Самая тяжёлая разобранная: <span lang="ja">'+esc(mainText(рек))+'</span> — вес '+Math.round(weightOf(рек))+'</p>':"")+
      '<p class="note">В группе A осталось '+скл(tierACount(),"карточка","карточки","карточек")+
        (S.imports.length>1&&S.imports[1].a!=null?' (на прошлом экспорте было '+S.imports[1].a+')':"")+'</p>'+
      (пр?'<p class="note">При нынешнем темпе план закроется примерно '+esc(пр.когда)+'</p>':"")+
      '<div class="acts" style="margin-top:10px"><button class="btn ghost" id="tallyCsv">Скачать таблицу CSV</button></div>'+
    '</div></details>'+
  '</div>';
}
function exportLog(){
  var by=logByDay(), дни=Object.keys(by).sort();

  var lines=["день,уроков,карточек,вес,держит"];
  дни.forEach(function(d){ var e=by[d]; lines.push([d,e.l,e.n,e.w,e.h].join(",")); });
  download("anki_итоги_"+dayKey()+".csv",lines.join("\n"));
  toast("Выгружено "+скл(дни.length,"день","дня","дней"));
}
function startLesson(num){
  var list=S.cards.filter(function(c){ return S.lesson[c.id]===num; });

  list.sort(function(a,b){ return weightOf(b)-weightOf(a); });

  $("#drill").hidden=false; document.body.style.overflow="hidden"; renderDrill();
}

  var list=dueCards();

      '<button class="item" data-m="sync">Синхронизация между устройствами<small>'+
        (S.sync.gist?"обмен идёт сам; последняя отправка: "+esc(S.sync.at||"ещё не было"):"настроить обмен")+'</small></button>'+
      '<button class="item" data-m="add">Добавить файл<small>новый экспорт или ответ нейросети</small></button>'+
      '<button class="item" data-m="task">Задание для нейросети<small>по текущей выборке</small></button>'+
      '<button class="item" data-m="ktask">Задание по кандзи<small>значения, радикалы, мнемоники</small></button>'+
      '<button class="item" data-m="cid">Список cid: для Anki<small>чтобы найти эти карточки в браузере Anki</small></button>'+
      '<button class="item" data-m="bulk">Отметить всё видимое проработанным</button><button class="item" data-m="forget">Забыть, что уже выгружено<small>тогда эти слова снова попадут в задание</small></button>'+
      '<hr>'+
      '<button class="item" data-m="texts">Скачать разборы и заметки<small>CSV</small></button>'+
      '<button class="item" data-m="backup">Резервная копия<small>JSON со всеми вашими текстами</small></button>'+
      '<button class="item" data-m="restore">Восстановить из копии</button>'+
      '<hr>'+
      '<button class="item" data-m="help">Как пользоваться</button>'+
      '<button class="item danger" data-m="wipe">Очистить всё</button>'+
    '</div>');
  $("#modalBody").onclick=function(e){
    var b=e.target.closest("[data-m]"); if(!b) return;
    var m=b.dataset.m;
    if(m==="plan") openPlan();
    if(m==="add") $("#fileinMenu").click();
    if(m==="task") openTask();
    if(m==="ktask") openKanjiTask();
    if(m==="cid") copyCid();
    if(m==="bulk") bulkDone();
    if(m==="forget"){ Object.keys(S.sent).forEach(function(id){ touch(id,"sent"); });
      S.sent={}; S.lastTask=null; saveSoon(); closeModal(); renderList();
      toast("Отметки о выгрузке сброшены"); }
    if(m==="texts"){ exportTexts(); closeModal(); }
    if(m==="backup"){ download("anki_backup.json",JSON.stringify({v:7,edits:S.edits,status:S.status,notes:S.notes,
      etym:S.etym,story:S.story,sent:S.sent,lastTask:S.lastTask,mtime:S.mtime,mtimes:S.mtimes,imports:S.imports,
      srs:S.srs,lesson:S.lesson,diff:S.diff,log:S.log,kanji:S.kanji,size:lessonSize()},null,1),"application/json"); closeModal(); }
    if(m==="restore") $("#impBackup").click();
    if(m==="sync") openSync();
    if(m==="help") openHelp();
    if(m==="wipe") confirmWipe();
  };
}
function openHelp(){
  openModal("Как пользоваться","",
    '<div style="font-size:13.5px;line-height:1.8">'+
    '<p><b>Буквы слева</b> — сколько раз вы провалили карточку: <b>A</b> 12 и больше, <b>B</b> от 8 (с этого числа Anki считает карточку личем), <b>C</b> 4–7, <b>D</b> до трёх.</p>'+
    '<p style="margin-top:8px"><b>Уроки.</b> Карточки разложены по урокам от самых тяжёлых к лёгким: '+
      'считаются число провалов, их доля и время ответа. Размер урока свой — 10, 20, 50, любой. '+
      'В уроке слово показывается без ответа: сначала попытка вспомнить, потом разбор. '+
      'Дальше три кнопки — они же назначают, когда карточка вернётся: '+
      '<b>не помню</b> — сегодня же, <b>с трудом</b> — завтра и медленно вширь, <b>помню</b> — через два дня, '+
      'потом всё реже. Расписание простое, как в старом Anki, и своё: в самой Anki ничего не меняется.</p>'+
    '<p style="margin-top:8px"><b>Чтобы слово перестало путаться.</b> В карточке под «похожими словами» '+
      'есть строка «в чём разница» — она хранится на паре и видна с обеих сторон. '+
      'Это главное лекарство: путаница между близкими словами держит их в провалах прочнее, чем сложность.</p>'+
    '<p style="margin-top:8px"><b>Знаки.</b> Кнопка <b>Знаки</b> открывает все кандзи колоды разом — '+
      'от самых мешающих к остальным, с поиском и фильтром «не разобраны». В строке списка знак '+
      'открывается <b>долгим нажатием</b> (обычный тап по-прежнему раскрывает карточку), '+
      'а в раскрытой карточке и в уроке — обычным нажатием на полоску под словом. '+
      'Подчёркнутые знаки — уже разобранные.</p>'+
    '<p style="margin-top:8px">В окне знака — значение, чтения, радикалы и их значения, этимология, '+
      'история, мнемоника и порядок черт, а ниже <b>все слова вашей колоды с этим знаком</b> '+
      'с числом провалов: видно, где именно знак мешает. Тексты пишете сами или собираете '+
      'нейросетью — кнопка «Задание» на экране знаков или ⋯ → Задание по кандзи.</p>'+
    '<p style="margin-top:8px"><b>С клавиатуры.</b> В уроке: <b>пробел</b> показывает разбор, '+
      '<b>1</b> — не помню, <b>2</b> — с трудом, <b>3</b> — помню. Цифры срабатывают только '+
      'когда разбор уже открыт, чтобы не оценить вслепую.</p>'+
    '<p style="margin-top:8px"><b>Ошиблись кнопкой.</b> <b>Ctrl+Z</b> или кнопка ↶ в шапке урока '+
      'отматывают последний ответ: возвращается и расписание карточки, и запись в дневнике, '+
      'и место в уроке. Жать можно сколько угодно раз подряд, хоть до начала урока. '+
      'Если последний ответ закрыл урок, откат есть и в окне «урок пройден».</p>'+
    '<p style="margin-top:8px"><b>Иногда наоборот.</b> Раз в три повтора урок показывает разбор и просит '+
      'вспомнить само слово — в Anki вы его только узнаёте и никогда не производите. '+
      'Отключается там же, в уроках. Рядом — кнопка 🔊: слово читает голос вашей системы, '+
      'ничего не качается и работает без интернета.</p>'+
    '<p style="margin-top:8px"><b>Фишка «знаю, но медленно»</b> отбирает карточки, где провалов мало, '+
      'а ответ долгий. Это будущие проблемы: память ещё хрупкая, хотя ошибок пока нет.</p>'+
    '<p style="margin-top:8px"><b>Круг работы:</b> отобрать фильтром «без разбора» → «Задание для нейросети» → скачать JSON → отдать нейросети с промптом → её ответ перетащить обратно сюда → читать в режиме «Читать по одной».</p>'+
    '<p style="margin-top:8px"><b>Клавиши:</b> <span class="kbd">/</span> поиск · <span class="kbd">j</span><span class="kbd">k</span> по списку · '+
    '<span class="kbd">Enter</span> раскрыть · <span class="kbd">d</span> отметить · <span class="kbd">s</span> читать по одной · <span class="kbd">Esc</span> закрыть. '+
    'В чтении: <span class="kbd">←</span><span class="kbd">→</span> или свайп.</p>'+
    '<p class="note" style="margin-top:10px">Ваши тексты хранятся: '+
    ({app:"в аккаунте Claude — список открывается и на телефоне",idb:"в базе этого устройства (IndexedDB), офлайн",local:"в этом браузере",memory:"нигде, только до перезагрузки"})[MODE]+
    '. Новый экспорт статистики их не затирает.</p></div>');
}
function confirmWipe(){
  openModal("Очистить всё?","Удалятся карточки, разборы и заметки. В Anki ничего не изменится.",
    '<div class="acts"><button class="btn danger" id="wipeYes">Да, очистить</button>'+
    '<button class="btn ghost" id="wipeNo">Отмена</button></div>');
  $("#wipeYes").onclick=async function(){
    var ks=await slist("ankidash:");
    for(var i=0;i<ks.length;i++) await sdel(ks[i]);
    S.cards=[]; S.edits={}; S.status={}; S.notes={}; S.etym={}; S.story={}; S.sent={}; S.lastTask=null;
    S.mtime={}; S.mtimes={}; S.srs={}; S.lesson={}; S.diff={}; S.log={}; S.kanji={}; S.imports=[]; S.deck=null;
    S.open=null; S.filters={}; setHas(false);
    /* Если обмен настроен, всё это тут же приехало бы обратно: вместе
       с текстами стёрлись и отметки времени, по которым видно, что их удалили.
       Поэтому обмен приостанавливаем, а токен и адрес оставляем. */
    var былОбмен=!!(S.sync.token||S.sync.gist);
    S.sync.off=true; S.sync.dirty=false;
    await sset(K.sync,JSON.stringify(S.sync));
    closeModal(); renderAll(); $("#progress").textContent="";
    toast(былОбмен
      ? "Очищено. Обмен приостановлен, чтобы стёртое не приехало обратно — включить снова можно в настройках синхронизации"
      : "Очищено", былОбмен?8000:2400);
  };
  $("#wipeNo").onclick=closeModal;
}
$("#menu").onclick=openMenu;
$("#theme").onclick=function(){
  /* Тем ровно две. «Как в системе» больше нет: она путала — экран менялся сам,
     без спроса. Первый запуск подхватывает системную, дальше решает человек. */
  S.theme=S.theme==="dark"?"light":"dark";
  applyTheme(); saveMeta(); toast("Тема: "+(S.theme==="dark"?"тёмная":"светлая"));
};
var narrow=window.matchMedia("(max-width:640px)");
function shortSort(){
  document.querySelectorAll("#sort option").forEach(function(o){
    if(!o.dataset.full) o.dataset.full=o.textContent;
    o.textContent = narrow.matches ? o.dataset.s : o.dataset.full;
  });
}
if(narrow.addEventListener) narrow.addEventListener("change",shortSort);
function systemDark(){
  try{ return matchMedia("(prefers-color-scheme: dark)").matches; }catch(x){ return false; }
}
function applyTheme(){
  if(S.theme!=="light"&&S.theme!=="dark") S.theme=systemDark()?"dark":"light";
  document.documentElement.setAttribute("data-theme",S.theme);
  var b=$("#theme");
  if(b) b.title=S.theme==="dark"?"Тема: тёмная. Нажмите — станет светлой"
                                :"Тема: светлая. Нажмите — станет тёмной";
}
function openModal(t,n,b){ $("#modalTitle").textContent=t; $("#modalNote").textContent=n||"";
  $("#modalBody").innerHTML=b||""; $("#modal").hidden=false; }
function closeModal(){ $("#modal").hidden=true; $("#modalBody").onclick=null; $("#modalBody").oninput=null; }
$("#modalX").onclick=closeModal;
$("#modal").addEventListener("click",function(e){ if(e.target.id==="modal") closeModal(); });

document.addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"").toLowerCase(), typing=(tag==="input"||tag==="textarea"||tag==="select");
  if(e.key==="Escape"){
    if(typing){ e.target.blur(); return; }
    if(!$("#modal").hidden){ closeModal(); return; }
    if(!$("#ksheet").hidden){ exitKanjiSheet(); return; }
    if(S.drill){ exitDrill(); return; }
    if(S.open){ S.open=null; renderList(); }
    return;
  }
  if(typing) return;
  if(S.drill){
    if((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z"||e.key==="я"||e.key==="Я")){
      if(S.drill.mode==="learn") undoGrade();
      e.preventDefault(); return;
    }
    /* как в Anki: пробел показывает разбор, цифры отвечают.
       Цифры работают только когда разбор уже открыт — иначе можно
       случайно оценить то, чего ещё не видел */
    if(S.drill.mode==="learn"){
      var gr=$("#drillGrades"), готовы=gr&&!gr.hidden;
      if((e.key===" "||e.key==="Enter")&&!готовы){ $("#drillShow").click(); e.preventDefault(); return; }
      if(готовы&&(e.key==="1"||e.key==="2"||e.key==="3")){
        var g=gr.querySelector('[data-g="'+(+e.key-1)+'"]');
        if(g) g.click();
        e.preventDefault(); return;
      }
    }
    if(e.key==="ArrowRight"||e.key==="n"){ drillMove(1); e.preventDefault(); }
    if(e.key==="ArrowLeft"||e.key==="p"){ drillMove(-1); e.preventDefault(); }
    if(e.key==="d"){ $("#drillDone").click(); e.preventDefault(); }
    return;
  }
  if(!S.cards.length) return;
  if(e.key==="/"){ e.preventDefault(); $("#q").focus(); return; }
  if(e.key==="s"){ e.preventDefault(); startDrill(visible(),0); return; }
  if(e.key==="j"||e.key==="k"){
    e.preventDefault();
    S.cursor=Math.max(0,Math.min(S._vis.length-1,S.cursor+(e.key==="j"?1:-1)));
    if(S.cursor>=(S.page+1)*S.PAGE) S.page++;
    renderList();
    var el=document.querySelector(".row.cursor"); if(el) el.scrollIntoView({block:"nearest"});
    return;
  }
  if(e.key==="Enter"&&S.cursor>=0){ e.preventDefault();
    var c=S._vis[S.cursor]; if(c){ S.open=S.open===c.id?null:c.id; renderList(); } return; }
  if(e.key==="d"&&S.cursor>=0){ e.preventDefault();
    var t=S._vis[S.cursor]; if(!t) return;
    if(S.status[t.id]==="done") delete S.status[t.id]; else { S.status[t.id]="done"; scheduleIfNew(t.id); }
  touch(t.id,"status");
    saveSoon(); renderHead(); renderChips(); renderList(); }
});

var deferredInstall=null;
window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); deferredInstall=e; $("#install").hidden=false; });
$("#install").onclick=function(){
  if(!deferredInstall){ toast("В этом браузере: меню → «Установить приложение» или «На экран Домой»",5000); return; }
  deferredInstall.prompt(); deferredInstall=null; $("#install").hidden=true;
};
window.addEventListener("appinstalled",function(){ $("#install").hidden=true; toast("Установлено"); });

/* Первый кадр рисуем сразу, не дожидаясь базы: если колода была,
   показываем силуэт списка, если её не было — сразу приглашение. */
(function(){
  var had=hadCards();
  if(had==="0"){ $("#boot").hidden=true; $("#intake").hidden=false; }
  else $("#boot").hidden=false;              // "1" и «не знаем» — ждём молча
})();

(async function(){
  await initStorage();
  var sy=await sget(K.sync); if(sy) try{ S.sync=JSON.parse(sy); }catch(x){}
  var ok=await loadAll();
  var новых=assignLessons();             // колода из старой версии: плана ещё нет
  var сброшено=await resetSchedule();    // разовый переход на расписание Anki
  var убрано=dropOldSrs();               // и состояния старой формы, если их принесла синхронизация
  if(новых||сброшено||убрано) saveSoon();
  if(сброшено) toast("Расписание переведено на правила Anki: "+
    скл(сброшено,"карточка снова новая","карточки снова новые","карточек снова новые"),6000);
  setHas(S.cards.length>0);
  shortSort(); applyTheme(); renderAll();
  if(MODE==="memory") $("#progress").textContent="Хранилище недоступно: тексты будут жить только до перезагрузки.";
  if(ok) toast("Загружено: "+S.cards.length+" карточек");
  weekSummary();
  syncOnOpen();
  /* ушли со страницы — отдаём накопленное; вернулись нескоро — забираем свежее */
  var awayAt=0;
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ awayAt=Date.now(); syncOnLeave(); return; }
    if(awayAt&&Date.now()-awayAt>120000){ awayAt=0; syncOnOpen(); }
  });
  window.addEventListener("pagehide",syncOnLeave);
  /* сеть появилась — досылаем то, что накопилось офлайн */
  window.addEventListener("online",function(){
    if(S.sync.auto&&S.sync.token&&S.sync.gist&&S.sync.ready&&S.sync.pending){
      S.sync.pending=false; syncSoon();
    }
  });
  if(navigator.serviceWorker && location.protocol!=="file:"){
    navigator.serviceWorker.register("sw.js").catch(function(e){ console.warn("sw:",e); });
  }
})();
})();
</script>
